# ============================================================
# REDPOINT INTERACTION (RPI) - Values Reference
# ============================================================
# COMPLETE catalog of every configurable value and its default.
#
# GENERATED from the chart's effective defaults - do not edit by hand.
# Regenerate with: python3 docs/gen_values_reference.py
#
# Browse this file to see what you can configure, then copy only the
# keys you want to change into your own overrides file. You do not need
# to set everything here; the chart applies these defaults automatically.
# ============================================================

# Global settings shared across all chart components
global:
  # Core deployment configuration
  deployment:
    # Container image settings for all RPI services
    images:
      # Kubernetes image pull policy
      imagePullPolicy: Always
      # Image pull secret for private registries
      imagePullSecret:
        # Enable image pull secret
        enabled: true
        # Name of the Kubernetes image pull secret
        name: redpoint-rpi
      # Container image registry and repository path
      registry: rg1acrpub.azurecr.io/docker/redpointglobal/releases
      # RPI version tag in format: <major.minor>.<year>-<MMDD>-<HHMM>
      tag: 7.8.20260903.1449
      # Per-service image overrides. When set, the value is used verbatim instead of
      # {registry}/{service-name}:{tag}. Useful for flat registries (e.g., ECR with all images
      # in a single repo).
      overrides: {}
    # Deployment mode: standard (production deployment) or demo (embedded MSSQL + MongoDB for
    # local dev/evaluation).
    mode: standard
    # Cloud environment: azure, amazon, google, or selfhosted
    platform: amazon
    # Set the pod timezone (e.g., 'America/New_York'); leave empty for default UTC
    podTimezone: ''

# Override the chart name used in resource names
nameOverride: ''

# Override the fully qualified app name used in resource names
fullnameOverride: ''

# Annotations applied to all resource types (ServiceAccounts, Services, Deployments, Pods)
commonAnnotations: {}

# Custom annotations applied to all chart resources
customAnnotations: {}

# Custom labels applied to all chart resources
customLabels: {}

# Labels applied to pod templates only (not Deployment metadata)
podLabels: {}

# Additional annotations for Services (merged with commonAnnotations)
serviceAnnotations: {}

# Additional annotations for ServiceAccounts (merged with commonAnnotations)
serviceAccountAnnotations: {}

# Database configuration for operational and data warehouse connections
databases:
  # Data warehouse provider configurations
  datawarehouse:
    # BigQuery data-warehouse configuration independent of the RPI hosting platform (supported
    # on Azure, AWS, and Google). Each connection defines its own authentication
    # configuration, including a service-account key via its own KeyFilePath or the configured
    # workload-identity/ADC mode. BigQuery credentials are configured independently from
    # cloudIdentity.google.
    bigquery:
      # List of BigQuery connection configurations
      connections:
      # BigQuery ODBC driver auth mode: 0 for a service account key; the driver's Application
      # Default Credentials value (typically 3) for workloadIdentity.
      - OAuthMechanism: 0
        allowLargeResults: 0
        # Kubernetes ConfigMap holding the service account key. Used only with
        # credentialsType=serviceAccount.
        configMapName: gbq-tenant1
        # serviceAccount: authenticate with a mounted service account key (provide
        # serviceAccountEmail, configMapName, keyName). workloadIdentity: keyless, using the
        # pod's Workload Identity service account.
        credentialsType: serviceAccount
        # Data key within the ConfigMap. Used only with credentialsType=serviceAccount. The
        # credential mounts at /app/google-creds/bigquery/<connection name>.json regardless of
        # the key name.
        keyName: gbq-tenant1.json
        largeResultsDataSetId: _bqodbc_temp_tables
        largeResultsTempTableExpirationTime: '3600000'
        # Connection name (used as the ODBC DSN name).
        name: gbq-tenant1
        # Google Cloud project ID (BigQuery catalog).
        projectId: gbq-tenant1
        # Service account email. Used only with credentialsType=serviceAccount.
        serviceAccountEmail: gbq-tenant1@my-project.iam.gserviceaccount.com
        sqlDialect: 1
      # Enable BigQuery data warehouse provider
      enabled: false
    # Snowflake data warehouse configuration
    snowflake:
      # Credentials type (e.g., snowflake_jwt)
      credentialsType: snowflake_jwt
      # Enable Snowflake data warehouse provider
      enabled: false
      # Snowflake private key files. Each entry has keyName and optional secretName.
      keys:
      # Key file name (e.g. tenant1-private-key.p8)
      - keyName: my-snowflake-rsakey.p8
        # K8s Secret containing the key file (kubernetes provider only)
        secretName: snowflake-rsa-private-key
      # Mount path for Snowflake key files (default: /app/snowflake-creds)
      mountPath: /app/snowflake-creds
      # CSI SecretProviderClass name for mounting keys from vault
      secretProviderClassName: ''
  # Operational database connection settings
  operational:
    # Google Cloud SQL Auth Proxy sidecar (GKE only; activates when platform=google,
    # provider=postgresql, and enabled=true)
    cloudSqlProxy:
      additionalArgs: []
      # Use IAM database authentication instead of password auth
      autoIamAuthn: false
      # Cloud SQL instance connection name in the form 'project:region:instance'
      connectionName: ''
      # Enable the Cloud SQL Auth Proxy sidecar
      enabled: false
      # Cloud SQL Auth Proxy container image (verbatim URI)
      image: 'gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.2'
      # Connect to the Cloud SQL private IP (requires VPC peering)
      privateIp: true
      # Resource requests and limits for the Cloud SQL Auth Proxy sidecar.
      resources:
        # Resource limits (maximum allocation)
        limits:
          # CPU limit (e.g., '1', '2')
          cpu: 200m
          # Memory limit (e.g., '1Gi', '3Gi')
          memory: 256Mi
        # Resource requests (guaranteed allocation)
        requests:
          # CPU request (e.g., '500m', '1')
          cpu: 50m
          # Memory request (e.g., '512Mi', '1Gi')
          memory: 64Mi
      # Graceful shutdown window (e.g. '30s')
      terminationGracePeriod: 30s
      # Local port the proxy listens on; used as ConnectionSettings__Port
      port: null
    # Schema the Deployment API uses within the operational database
    databaseSchema: dbo
    # Enable TLS encryption for database connections
    encrypt: true
    # Authenticate to Cloud SQL for PostgreSQL via GKE Workload Identity (Application Default
    # Credentials). Requires provider=postgresql, global.deployment.platform=google, and
    # cloudIdentity.enabled=true; cannot be combined with cloudSqlProxy.enabled.
    googleWorkloadIdentity: false
    # Database provider type
    provider: sqlserver
    # Name of the Pulse operational database
    pulse_database_name: <my-pulse-database-name>
    # Name of the Pulse logging database
    pulse_logging_database_name: <my-logging-database-name>
    # Database server hostname or IP address
    server_host: <my-database-server-host>
    # Database server username
    server_username: <my-database-server-username>

# How secrets are provided to pods: kubernetes (K8s Secret), sdk (cloud vault at runtime), or
# csi (CSI driver syncs vault to K8s Secret)
secretsManagement:
  # CSI driver settings — syncs cloud vault to K8s Secret (provider: csi)
  csi:
    # K8s secret name created by the CSI driver
    secretName: redpoint-rpi-secrets
    # SecretProviderClass definitions for CSI driver
    secretProviderClasses:
    # SecretProviderClass name.
    - name: my-secret-class-1
      # Vault object to mount.
      objects:
        # Vault object name to mount.
        - objectName: my-tls-certificate
          # Vault object type (secret, key, cert).
          objectType: secret
      # Provider-specific driver parameters, passed verbatim to the SecretProviderClass (keys
      # differ per provider).
      parameters:
        clientID: my-managed-identity-client-id
        keyvaultName: my-keyvault-name
        resourceGroup: my-resource-group
        subscriptionId: my-subscription-id
        tenantId: my-azure-tenant-id
        usePodIdentity: 'false'
        useVMManagedIdentity: 'false'
        useWorkloadIdentity: 'true'
      # CSI secrets-store provider (azure, aws, gcp, vault).
      provider: azure
      # Kubernetes Secret synced from mounted objects.
      secretObjects:
        # Key mapping inside the synced Secret.
        - data:
            # Key inside the synced Kubernetes Secret.
            - key: tls.key
              # Vault object whose value fills the key.
              objectName: my-tls-certificate
          # Kubernetes Secret the driver syncs the objects into.
          secretName: secret1
          # Kubernetes Secret type (e.g. Opaque, kubernetes.io/tls).
          type: kubernetes.io/tls
    # SecretProviderClass name.
    - name: my-secret-class-2
      # Vault object to mount.
      objects:
        # Vault object name to mount.
        - objectName: V7-ConnectionString-Operations
          # Vault object type (secret, key, cert).
          objectType: secret
      # Provider-specific driver parameters, passed verbatim to the SecretProviderClass (keys
      # differ per provider).
      parameters:
        clientID: my-managed-identity-client-id
        enable-secret-rotation: 'true'
        keyvaultName: my-keyvault-name
        resourceGroup: my-resource-group
        subscriptionId: my-subscription-id
        syncSecret: 'true'
        tenantId: my-azure-tenant-id
        usePodIdentity: 'false'
        useVMManagedIdentity: 'false'
        useWorkloadIdentity: 'true'
      # CSI secrets-store provider (azure, aws, gcp, vault).
      provider: azure
      # Kubernetes Secret synced from mounted objects.
      secretObjects:
        # Key mapping inside the synced Secret.
        - data:
            # Key inside the synced Kubernetes Secret.
            - key: ConnectionString_Logging_Database
              # Vault object whose value fills the key.
              objectName: V7-ConnectionString-LoggingDatabase
          # Kubernetes Secret the driver syncs the objects into.
          secretName: secret2
          # Kubernetes Secret type (e.g. Opaque, kubernetes.io/tls).
          type: Opaque
    # Which service's pod mounts the SecretProviderClass to trigger the CSI sync into the
    # Kubernetes Secret (none disables the sync pod).
    syncService: none
  # Kubernetes secrets settings (provider: kubernetes)
  kubernetes:
    # Name of the pre-created Kubernetes secret containing application credentials
    secretName: redpoint-rpi-secrets
  # Secrets management provider
  provider: kubernetes
  # SDK settings — app reads from cloud vault directly (provider: sdk)
  sdk:
    # AWS Secrets Manager SDK settings
    amazon:
      # Tag key used to filter secrets in AWS Secrets Manager
      secretTagKey: ''
    # Azure Key Vault SDK settings
    azure:
      # Interval in seconds to reload configuration from vault
      configurationReloadIntervalSeconds: 30
      # Use Azure AD token for database connections
      useADTokenForDatabaseConnection: true
      # Azure Key Vault URI
      vaultUri: 'https://myvault.vault.azure.net/'
    # Read app settings (including the database connection) from the cloud vault. Keep true in
    # SDK mode (all clouds).
    useForAppSettings: false
    # Store RPI config passwords in the cloud vault. Set false to keep them in the operational
    # database instead (some vaults reject empty secret values).
    useForConfigPasswords: false

# Pod-to-cloud authentication. Required for sdk and csi secrets modes. Authentication
# mechanism derived from global.deployment.platform.
cloudIdentity:
  # Amazon IRSA / Access Keys settings
  amazon:
    # AWS region (e.g., us-east-1)
    region: us-east-1
    # IAM Role ARN for IRSA (IAM Roles for Service Accounts)
    roleArn: 'arn:aws:iam::my-aws-account-id:role/my-role-name'
    # Inject AWS access keys from the main K8s Secret (AWS_Access_Key_ID,
    # AWS_Secret_Access_Key)
    useAccessKeys: false
  # Azure Workload Identity settings
  azure:
    # Azure Managed Identity Client ID for Workload Identity
    managedIdentityClientId: your-workload-identity-client-id
    # Azure Active Directory Tenant ID
    tenantId: your-azure-tenant-id
  # Enable cloud identity for pod authentication to cloud services
  enabled: false
  # Platform-level Google Cloud identity for the RPI platform. Rendered only when
  # global.deployment.platform is google and used by Google platform services such as Cloud
  # Storage, Secret Manager, Pub/Sub, and Cloud SQL proxy. BigQuery authentication is
  # configured independently under databases.datawarehouse.bigquery.
  google:
    # Mount path for the ConfigMap
    configMapFilePath: /app/google-creds
    # ConfigMap containing the service account JSON credentials
    configMapName: my-google-svs-account
    # Key file name within the ConfigMap
    keyName: my-google-svs-account.json
    # Google Cloud project ID
    projectId: your_google_project_id
    # Google Cloud service account email
    serviceAccountEmail: my-google-svs-account@my-project.iam.gserviceaccount.com
  # ServiceAccount configuration. shared=one SA for all pods; per-service=each service gets
  # its own SA.
  serviceAccount:
    # shared: one SA for all pods. per-service: each service gets its own SA.
    mode: per-service
    # Name of the ServiceAccount
    name: redpoint-rpi

# Mount custom CA certificates into all pods
customCACerts:
  # Enable custom CA certificate mounting
  enabled: false
  # Mount path for CA certificates inside the container
  mountPath: /usr/local/share/ca-certificates/custom
  # Name of the ConfigMap or Secret containing CA certificates
  name: ''
  # Optional: specific CA bundle filename. When set, SSL_CERT_FILE env var is set to
  # mountPath/certFile
  certFile: ''

# SMTP email settings for notifications
SMTPSettings:
  # Enable SSL/TLS for SMTP connection
  EnableSSL: true
  # SMTP server hostname
  SMTP_Address: your_smtp_host
  # SMTP server port
  SMTP_Port: 587
  # Sender email address
  SMTP_SenderAddress: noreply-rpi@example.com
  # Sender display name
  SMTP_SenderName: Redpoint Global
  # SMTP authentication username
  SMTP_Username: your_smtp_server_username
  # Use authentication credentials for SMTP
  UseCredentials: true

# OpenID Connect provider configuration for SSO
OpenIdProviders:
  # OpenID audience identifier
  audience: 'api://00000000-0000-0000-0000-000000000000'
  # OpenID authorization endpoint URL
  authorizationHost: 'https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0'
  # OpenID client ID
  clientID: 00000000-0000-0000-0000-000000000000
  # Enable refresh token support
  enableRefreshTokens: true
  # Enable OpenID Connect authentication
  enabled: false
  # Parameter name for ID token on logout
  logoutIdTokenParameter: id_token_hint
  # OpenID provider name
  name: Keycloak
  # Redirect URL after authentication
  redirectURL: 'https://rpi-interactionapi.example.com'
  # Whether the provider supports user management
  supportsUserManagement: false
  # Validate the token audience
  validateAudience: true
  # Validate the token issuer
  validateIssuer: false
  # Custom OAuth scopes to request
  customScopes: []

# Microsoft Entra ID (formerly Azure AD) authentication configuration
MicrosoftEntraID:
  # Enable Microsoft Entra ID authentication
  enabled: false
  # Entra ID API application ID
  interaction_api_id: 00000000-0000-0000-0000-000000000000
  # Entra ID application (client) ID for Interaction
  interaction_client_id: 00000000-0000-0000-0000-000000000000
  # Entra ID tenant (directory) ID
  tenant_id: 00000000-0000-0000-0000-000000000000

# Ingress configuration for external access to RPI services
ingress:
  # ACM certificate ARN (required if certificateSource=acm)
  certificateArn: your_acm_certificate_arn
  # TLS certificate source: kubernetes (K8s Secret) or acm (AWS Certificate Manager)
  certificateSource: kubernetes
  # Ingress class name override (defaults to release namespace)
  className: rpi-namespace
  # Ingress controller configuration
  controller:
    # Deploy a chart-managed ingress controller (false if supplying your own)
    enabled: false
  # Base domain for ingress hostnames
  domain: example.com
  # Service hostnames — subdomains are prepended to domain; values with a dot are used as
  # FQDNs
  hosts:
    # Callback API hostname or subdomain (or FQDN)
    callbackapi: rpi-callbackapi
    # Interaction API hostname or subdomain
    client: rpi-interactionapi
    # Deployment API hostname or subdomain
    config: rpi-deploymentapi
    # Integration API hostname or subdomain
    integration: rpi-integrationapi
    # Queue Reader hostname or subdomain
    queuereader: rpi-queuereader
    # RabbitMQ console hostname or subdomain
    rabbitmqconsole: rpi-rabbitmq-console
    # Realtime API hostname or subdomain
    realtime: rpi-realtimeapi
    # Smart Activation hostname or subdomain
    smartactivation: rpi-smartActivation
  # Ingress controller image override.
  internalImageOverride:
    # Pull the ingress-nginx controller from the image below instead of the public registry
    # (air-gapped or mirrored registries).
    enabled: false
    # Full ingress-nginx controller image reference used when enabled.
    image: 'registry.k8s.io/ingress-nginx/controller:v1.14.3@sha256:82917be97c0939f6ada1717bb39aa7e66c229d6cfb10dcfc8f1bd42f9efe0f81'
  # Ingress mode: public (internet-facing) or private (internal only)
  mode: public
  # Private link configuration
  privateLink:
    # Azure Private Link settings
    azure:
      # Enable Azure Private Link
      enabled: false
  # VPC subnet name (required if mode=private)
  subnetName: <my-ingress-vpc-subnet-name>
  # TLS configuration entries (rendered when certificateSource=kubernetes)
  tls:
  # Kubernetes TLS secret name
  - secretName: ingress-tls
  # Custom ingress annotations (replaces defaults when set)
  annotations: {}

# Kubernetes Network Policy configuration
networkPolicy:
  # Allow DNS egress from every service pod when the network policy is enabled.
  allowDNS: true
  # Enable Kubernetes network policies
  enabled: false

# Service mesh configuration
serviceMesh:
  # Enable service mesh integration
  enabled: false
  # Extra pod annotations added when the service mesh is enabled, passed verbatim.
  podAnnotations: {}
  # Service mesh provider
  provider: linkerd
  # Linkerd Server defaults applied to every service, passed verbatim.
  serverDefaults: {}
  # Linkerd Server CRDs for L7 traffic policy
  servers: []

# Storage configuration for persistent volume claims and volumes
storage:
  # Additional PersistentVolumeClaims the chart creates from the storage class.
  dynamicPVCs: []
  # Persistent volume claim configurations
  persistentVolumeClaims:
    # PVC for data management upload directory
    DataManagementUploadDirectory:
      # PVC claim name
      claimName: rpdmuploaddirectory
      # Enable this PVC
      enabled: false
      # Mount path in the container
      mountPath: /rpdmuploaddirectory
    # PVC for file output directory
    FileOutputDirectory:
      # PVC claim name
      claimName: rpifileoutputdir
      # Enable this PVC
      enabled: false
      # Mount path in the container
      mountPath: /rpifileoutputdir
    # PVC for realtime plugins
    Plugins:
      # PVC claim name
      claimName: realtimeplugins
      # Enable this PVC
      enabled: false
      # Mount path in the container
      mountPath: /app/plugins
  # Create PV + PVC pairs (for CSI-backed storage)
  persistentVolumes: []
  # Optional StorageClass for CSI-backed storage (EFS, Azure File, etc.)
  storageClass:
    # Create a StorageClass resource
    enabled: false
    # Mount options for the chart-managed StorageClass.
    mountOptions: []
    # Name of the StorageClass
    name: redpoint-rpi
    # Provisioner-specific parameters
    parameters: {}
    # CSI provisioner (e.g., efs.csi.aws.com)
    provisioner: ''
    # Reclaim policy
    reclaimPolicy: Delete
    # Volume binding mode of the chart-managed StorageClass (Immediate or
    # WaitForFirstConsumer).
    volumeBindingMode: Immediate

# Kubernetes node selector for pod scheduling
nodeSelector:
  # Enable node selector
  enabled: false
  # Node label key
  key: app
  # Node label value
  value: redpoint-rpi

# Kubernetes tolerations for pod scheduling on tainted nodes
tolerations:
  # Toleration effect (e.g., NoSchedule)
  effect: NoSchedule
  # Enable tolerations
  enabled: false
  # Toleration key
  key: app
  # Toleration operator (e.g., Equal, Exists)
  operator: Equal
  # Toleration value
  value: redpoint-rpi

# Pod anti-affinity settings applied to all services
podAntiAffinity:
  # Enable pod anti-affinity
  enabled: true
  # Topology key for anti-affinity spreading
  topologyKey: kubernetes.io/hostname
  # Anti-affinity type: preferred (soft) or required (hard)
  type: preferred
  # Weight for preferred anti-affinity (1-100, ignored for required)
  weight: 100

# Global topology spread constraints overrides (merged with defaults from _defaults.tpl)
topologySpreadConstraints:
  # Spread each service's pods across the topology key below.
  enabled: true
  # Maximum difference in pod count between topology domains.
  maxSkew: 1
  # Node label used as the topology domain (e.g. kubernetes.io/hostname).
  topologyKey: kubernetes.io/hostname
  # DoNotSchedule or ScheduleAnyway when the constraint cannot be met.
  whenUnsatisfiable: ScheduleAnyway

# Node provisioning for dedicated RPI nodes (Karpenter NodePool)
nodeProvisioning:
  # Enable node provisioning
  enabled: false
  # Karpenter NodePool configuration
  karpenter:
    # nodePool settings.
    nodePool:
      # Node consolidation settings.
      disruption:
        # How long a node stays underutilized before consolidation (e.g. 15m).
        consolidateAfter: 15m
        # Karpenter consolidation policy: WhenEmpty or WhenEmptyOrUnderutilized.
        consolidationPolicy: WhenEmpty
      # Node lifetime before Karpenter replaces it (e.g. 360h).
      expireAfter: 360h
      # Labels applied to provisioned nodes, passed verbatim to the NodePool spec.
      labels: {}
      # Resource ceilings for the pool.
      limits:
        # Maximum total CPU the pool may provision.
        cpu: '1000'
        # Maximum total memory the pool may provision.
        memory: 1000Gi
      # Name of the Karpenter NodePool created for RPI workloads.
      name: redpoint-nodepool
      # Reference to the cloud node class the pool provisions from.
      nodeClassRef:
        # API group of the node class the pool references.
        group: karpenter.k8s.aws
        # Kind of the node class the pool references (e.g. EC2NodeClass).
        kind: EC2NodeClass
        # Name of the node class the pool references.
        name: default
      # Karpenter scheduling requirements, passed verbatim to the NodePool spec.
      requirements: []
      # Startup taints applied to provisioned nodes, passed verbatim to the NodePool spec.
      startupTaints: []
      # Taints applied to provisioned nodes, passed verbatim to the NodePool spec.
      taints: []
      # NodePool weight; higher wins when several pools satisfy a pod.
      weight: 10
  # Node provisioner
  provider: karpenter

# Global resource defaults applied to all services. Per-service overrides take priority.
resources:
  # Resource limits (maximum allocation)
  limits:
    # Memory limit (e.g., '1Gi', '3Gi')
    memory: 3Gi
    # CPU limit (e.g., '1', '2')
    cpu: ''
  # Resource requests (guaranteed allocation)
  requests:
    # CPU request (e.g., '500m', '1')
    cpu: 50m
    # Memory request (e.g., '512Mi', '1Gi')
    memory: 256Mi

# Global pod security context overrides (merged with defaults from _defaults.tpl)
securityContext:
  # Allow the process to gain more privileges than its parent.
  allowPrivilegeEscalation: false
  # Linux capabilities.
  capabilities:
    # Capabilities dropped from the container.
    drop:
    - ALL
  # Emit the security context on the pod and container.
  enabled: true
  # GID applied to mounted volumes.
  fsGroup: 7777
  # Run the container in privileged mode.
  privileged: false
  # Mount the container root filesystem read-only.
  readOnlyRootFilesystem: true
  # Primary GID of the container process.
  runAsGroup: 7777
  # Require the container to run as a non-root user.
  runAsNonRoot: true
  # UID the container runs as.
  runAsUser: 7777
  # Additional GIDs applied to the pod.
  supplementalGroups:
  - 1000
  - 4000
  - 5000
  # AppArmor profile applied to the container; empty for none.
  appArmorProfile: ''

# Global liveness probe overrides (merged with defaults from _defaults.tpl)
livenessProbe:
  # Emit the probe on every service container.
  enabled: true
  # Consecutive failures before the probe is considered failed.
  failureThreshold: 5
  # Seconds after container start before the first probe.
  initialDelaySeconds: 60
  # Seconds between probes.
  periodSeconds: 15
  # Seconds before a probe attempt times out.
  timeoutSeconds: 5

# Global readiness probe overrides (merged with defaults from _defaults.tpl)
readinessProbe:
  # Emit the probe on every service container.
  enabled: true
  # Consecutive failures before the probe is considered failed.
  failureThreshold: 5
  # Seconds after container start before the first probe.
  initialDelaySeconds: 20
  # Seconds between probes.
  periodSeconds: 30
  # Seconds before a probe attempt times out.
  timeoutSeconds: 5

# Global startup probe overrides (merged with defaults from _defaults.tpl)
startupProbe:
  # Emit the probe on every service container.
  enabled: true
  # Consecutive failures before the probe is considered failed.
  failureThreshold: 60
  # Seconds after container start before the first probe.
  initialDelaySeconds: 10
  # Seconds between probes.
  periodSeconds: 10
  # Seconds before a probe attempt times out.
  timeoutSeconds: 5

# Enable Prometheus scrape annotations on all RPI service pods
customMetrics:
  # Enable Prometheus metrics annotations on all services
  enabled: false

# Diagnostics mode configuration for troubleshooting and monitoring
diagnosticsMode:
  # Copy diagnostics to Azure Blob Storage
  copytoAzureBlob:
    # Use Azure Data Lake Storage Gen2
    UseDataLakeStorageGen2: false
    # Azure Storage account name
    accountName: <yourstorageaccount>
    # Azure Blob service endpoint URL
    blobServiceEndpoint: 'https://yourstorage.blob.core.windows.net'
    # Azure Blob container name
    containerName: <yourstorageaccount-container-name>
    # Enable CDN for blob access
    enableCdn: false
    # Enable copying to Azure Blob
    enabled: false
    # Use the pod's managed identity instead of the access key
    useAzureIdentityAuthentication: false
  # Copy diagnostics to SFTP server
  copytoSftp:
    # Enable copying to SFTP
    enabled: false
    # SFTP server hostname
    sftpHost: <your-sftp-host>
    # SFTP port
    sftpPort: '22'
    # SFTP username
    sftpUsername: <your-sftp-username>
    # Transfer diagnostics over SFTP rather than plain FTP
    useSftp: true
  # .NET diagnostic tools settings
  dotNetTools:
    # Enable .NET diagnostic tools
    enabled: false
    # Enable dotnet-counters collection in diagnostics mode.
    useCounters: false
    # Enable dotnet-gcdump collection in diagnostics mode.
    useGcDump: false
  # Network-utilities diagnostics pod.
  netutils:
    # Deploy the network-utilities pod for connectivity troubleshooting.
    enabled: false
    # Security context for the network-utilities pod.
    securityContext:
      # Allow the process to gain more privileges than its parent.
      allowPrivilegeEscalation: false
      # Linux capabilities.
      capabilities:
        # Capabilities added (NET_ADMIN and NET_RAW enable packet tools).
        add:
        - NET_ADMIN
        - NET_RAW
        # Capabilities dropped from the container.
        drop:
        - ALL
      # Run the container in privileged mode.
      privileged: false
      # Mount the container root filesystem read-only.
      readOnlyRootFilesystem: true
      # Primary GID of the container process.
      runAsGroup: 7777
      # Require the container to run as a non-root user.
      runAsNonRoot: true
      # UID the container runs as.
      runAsUser: 7777

# Validation pods that verify storage mounts and CSI secret mounts are working
validationPods:
  # List of validation pod deployment definitions
  deployments: []

# Automatic database upgrade job - calls the upgrade endpoint after an image tag change. The
# net-utils image resolves through the canonical rpi.image helper; override via
# global.deployment.images.overrides.net-utils or global.deployment.images.nameOverrides.net-
# utils.
databaseUpgrade:
  # Seconds the database-upgrade Job may run before Kubernetes terminates it.
  activeDeadlineSeconds: 900
  # Retries before the database-upgrade Job is marked failed.
  backoffLimit: 3
  # Enable automatic database upgrade
  enabled: false
  # Seconds the Job waits for the Deployment API to report ready before starting the upgrade.
  maxReadyWaitSeconds: '600'
  # Email notification settings for upgrade completion
  notification:
    # Enable upgrade notification emails
    enabled: false
    # Recipient email for upgrade notifications
    recipientEmail: ''
  # Seconds between readiness polls of the Deployment API.
  pollIntervalSeconds: '15'
  # Resource requests and limits for the database-upgrade Job.
  resources:
    # Resource limits (maximum allocation)
    limits:
      # CPU limit (e.g., '1', '2')
      cpu: 200m
      # Memory limit (e.g., '1Gi', '3Gi')
      memory: 128Mi
    # Resource requests (guaranteed allocation)
    requests:
      # CPU request (e.g., '500m', '1')
      cpu: 50m
      # Memory request (e.g., '512Mi', '1Gi')
      memory: 64Mi
  # Seconds a finished Job is retained before Kubernetes deletes it.
  ttlSecondsAfterFinished: 3600
  # Seconds the Job waits for the upgrade call to complete.
  waitTimeoutSeconds: '360'

# Interaction API service configuration — main API for client/UI interactions
interactionapi:
  # Native-auth access token lifetime in seconds.
  accessTokenLifetimeSeconds: 3600
  # Account lockout after repeated failed sign-in attempts (deployment-wide; the Integration
  # API shares the same user store). Keys are optional; unset keys use the application
  # defaults.
  accountLockout:
    # Failed sign-in attempts before the account is locked (no chart default)
    maxFailedAccessAttempts: null
    # Lockout duration as a .NET TimeSpan, e.g. 00:05:00 (no chart default)
    lockoutTimeSpan: ''
  # Allow the RPI client to remember login details.
  allowSavingLoginDetails: true
  # Always show the tenant (client) picker on the login screen.
  alwaysShowClientsAtLogin: true
  # Resolve the RPI authentication metadata over plain HTTP inside the cluster instead of the
  # public HTTPS host.
  authMetaHttpEnabled: true
  # Horizontal Pod Autoscaler configuration
  autoscaling:
    # Enable horizontal pod autoscaling
    enabled: false
    # Maximum number of replicas
    maxReplicas: 5
    # Minimum number of replicas
    minReplicas: 2
    # Target CPU utilization percentage for autoscaling
    targetCPUUtilizationPercentage: 80
    # Target average memory utilization percentage for the autoscaler
    targetMemoryUtilizationPercentage: 80
    # Autoscaling type: hpa or keda
    type: hpa
  # Prometheus scrape settings for this service.
  customMetrics:
    # Expose the service metrics endpoint for scraping.
    enabled: false
    # Add the prometheus.io/scrape pod annotation.
    prometheus_scrape: false
  # Disable app-level HTTP-to-HTTPS redirection. Default false; the redirect is also skipped
  # when the in-cluster auth metadata host is set.
  disableHttpRedirect: false
  # Enable RPI authentication for this service
  enableRPIAuthentication: true
  # Enable the Interaction API service
  enabled: true
  # Interaction API file-output behavior.
  fileOutput:
    # Allow writing file output to any server location.
    allowAllServerLocations: true
    # Allow per-client file-output directory overrides.
    allowClientOverrides: true
  # Interaction API log levels and log-forwarding sinks.
  logging:
    # Console log level.
    Console: Error
    # Database log sink level.
    database: Error
    # Default log level.
    default: Error
    # Loggly log forwarding. Set enabled: true and populate Secret key Loggly_ApiKey.
    loggly:
      # Enable Loggly forwarding.
      enabled: false
      # Loggly log ingest endpoint.
      httpsEndpoint: 'https://logs-01.loggly.com'
      # Default forwarded level.
      logLevelDefault: Information
      # RPIError level.
      rpiError: Information
      # RPITrace level.
      rpiTrace: Error
    # Microsoft namespace log level.
    microsoft: Warning
    # Microsoft.Hosting.Lifetime log level.
    microsoftHostingLifetime: Warning
    # New Relic log forwarding. Set enabled: true and populate Secret key NewRelic_ApiKey.
    newRelic:
      # Enable New Relic forwarding.
      enabled: false
      # New Relic log ingest endpoint.
      httpsEndpoint: 'https://log-api.newrelic.com/log/v1'
      # Default forwarded level.
      logLevelDefault: Information
      # RPIError level.
      rpiError: Information
      # RPITrace level.
      rpiTrace: Error
    # Database RPIError level.
    rpiError: Error
    # Database RPITrace level.
    rpiTrace: Error
  # RPI Client map control. Set enabled: true and populate Secret key
  # MapControl_ApplicationId.
  mapControl:
    # Enable the map control.
    enabled: false
    # Map provider.
    provider: Bing
  # Mercury integration. Set enabled: true and populate Secret key Mercury_Password.
  mercury:
    # Mercury service address.
    address: ''
    # Enable the Mercury integration.
    enabled: false
    # Mercury username.
    username: ''
  # Force interactive login for Microsoft Entra ID authentication.
  microsoftForceLogin: true
  # Operational database resilience settings.
  operationalDatabase:
    # Maximum operational-database connection retry attempts.
    maxRetryCount: 12
    # Delay (hh:mm:ss) between operational-database retries.
    maxRetryDelay: '00:01:00'
  # Native-auth password policy enforced when users are created or change their password
  # (deployment-wide; the Integration API shares the same user store)
  passwordPolicy:
    # Require at least one digit (default true)
    requireDigit: true
    # Require at least one lowercase letter (default true)
    requireLowercase: true
    # Require at least one non-alphanumeric character (default true)
    requireNonAlphanumeric: true
    # Require at least one uppercase letter (default true)
    requireUppercase: true
    # Minimum password length (default 6)
    requiredLength: 6
    # Minimum number of distinct characters (default 1)
    requiredUniqueChars: 1
  # Extra annotations added to this service's pods.
  podAnnotations: {}
  # PodDisruptionBudget for this service.
  podDisruptionBudget:
    # Create a PodDisruptionBudget for the workload.
    enabled: false
    # Minimum pods that must stay available during voluntary disruption (count or percentage).
    minAvailable: 1
  # Extra labels added to this service's pods.
  podLabels: {}
  # Product-update feed shown in the RPI client.
  productUpdateFeed:
    # Show the Redpoint product-update feed in the RPI client.
    enabled: true
    # URL of the product-update feed.
    url: 'https://www.redpointglobal.com/feed/productfeed'
  # Azure Web PubSub. Set enabled: true and populate Secret key PubSub_ConnectionString.
  pubSub:
    # Azure PubSub settings.
    azureSettings:
      # Azure Web PubSub endpoint URL.
      endpoint: ''
    # Enable Web PubSub.
    enabled: false
    # PubSub provider.
    provider: Azure
  # Native-auth refresh token lifetime in seconds.
  refreshTokenLifetimeSeconds: 36000
  # Number of Interaction API pod replicas
  replicas: 1
  # CPU and memory resource requests and limits
  resources:
    # Apply the requests and limits below to the container. false deploys the container
    # without resource constraints.
    enabled: true
    # Resource limits (maximum allocation)
    limits:
      # Memory limit (e.g., '1Gi', '3Gi')
      memory: 3Gi
      # CPU limit (e.g., '1', '2')
      cpu: ''
    # Resource requests (guaranteed allocation)
    requests:
      # CPU request (e.g., '500m', '1')
      cpu: 50m
      # Memory request (e.g., '512Mi', '1Gi')
      memory: 256Mi
  # Argo Rollout settings, used when type is rollout.
  rollout:
    # Promote the new revision automatically once it is healthy.
    autoPromotionEnabled: true
    # Number of old ReplicaSets retained for rollback.
    revisionHistoryLimit: 3
  # ServiceAccount for this service.
  serviceAccount:
    # Create a dedicated ServiceAccount for the service; cloud identity annotations are
    # applied to it.
    enabled: true
  # This Interaction API's externally reachable host and port.
  serviceHost:
    # Emit RPI__ServiceHostName / RPI__ServiceHostPortNumber (default false).
    enabled: false
    # Service host name.
    name: rpi-interactionapi
    # Service host port.
    portNumber: 80
  # Custom SystemVariables exposed to workflows. Each item: {name, value}.
  systemVariables: []
  # Seconds Kubernetes waits for the pod to stop gracefully before killing it.
  terminationGracePeriodSeconds: 120
  # Workload kind: deployment (Kubernetes Deployment) or rollout (Argo Rollout). Stateful
  # services use StatefulSet.
  type: deployment
  # User management mode. Enabling Keycloak (OpenIdProviders) forces external management on.
  userManagement:
    # Use an external identity provider for user management.
    useExternalUserManagement: false
    # Use RPI native user management.
    useNativeUserManagement: true
  # RPI Client weather lookup. Set enabled: true and populate Secret key Weather_ApiKey.
  weatherApi:
    # Weather service address.
    address: 'https://dataservice.accuweather.com'
    # Enable weather lookups.
    enabled: false

# Integration API service configuration — handles external system integrations and Smart
# Activation communication
integrationapi:
  # Resolve the RPI authentication metadata over plain HTTP inside the cluster instead of the
  # public HTTPS host.
  authMetaHttpEnabled: false
  # Horizontal Pod Autoscaler configuration
  autoscaling:
    # Enable horizontal pod autoscaling
    enabled: false
    # Maximum number of replicas
    maxReplicas: 5
    # Minimum number of replicas
    minReplicas: 2
    # Target CPU utilization percentage for autoscaling
    targetCPUUtilizationPercentage: 80
    # Target average memory utilization percentage for the autoscaler
    targetMemoryUtilizationPercentage: 80
    # Autoscaling type: hpa or keda
    type: hpa
  # Prometheus scrape settings for this service.
  customMetrics:
    # Expose the service metrics endpoint for scraping.
    enabled: false
    # Add the prometheus.io/scrape pod annotation.
    prometheus_scrape: true
  # Enable RPI authentication for this service
  enableRPIAuthentication: true
  # Serve the Integration API Swagger UI.
  enableSwagger: true
  # Enable the Integration API service
  enabled: true
  # Log settings for this service.
  logging:
    # Console log level.
    Console: Error
    # Database log sink level.
    database: Error
    # Default log level.
    default: Error
    # Database RPIError level.
    rpiError: Error
    # Database RPITrace level.
    rpiTrace: Error
  # Extra annotations added to this service's pods.
  podAnnotations: {}
  # PodDisruptionBudget for this service.
  podDisruptionBudget:
    # Create a PodDisruptionBudget for the workload.
    enabled: false
    # Minimum pods that must stay available during voluntary disruption (count or percentage).
    minAvailable: 1
  # Extra labels added to this service's pods.
  podLabels: {}
  # Read timeout in milliseconds that the Smart Activation services use when calling the
  # Integration API (emitted only on those pods).
  read_timeout: '300000'
  # Number of Integration API pod replicas
  replicas: 1
  # CPU and memory resource requests and limits
  resources:
    # Apply the requests and limits below to the container. false deploys the container
    # without resource constraints.
    enabled: true
    # Resource limits (maximum allocation)
    limits:
      # Memory limit (e.g., '1Gi', '3Gi')
      memory: 3Gi
      # CPU limit (e.g., '1', '2')
      cpu: ''
    # Resource requests (guaranteed allocation)
    requests:
      # CPU request (e.g., '500m', '1')
      cpu: 50m
      # Memory request (e.g., '512Mi', '1Gi')
      memory: 256Mi
  # Argo Rollout settings, used when type is rollout.
  rollout:
    # Promote the new revision automatically once it is healthy.
    autoPromotionEnabled: true
    # Number of old ReplicaSets retained for rollback.
    revisionHistoryLimit: 3
  # ServiceAccount for this service.
  serviceAccount:
    # Create a dedicated ServiceAccount for the service; cloud identity annotations are
    # applied to it.
    enabled: true
  # Seconds Kubernetes waits for the pod to stop gracefully before killing it.
  terminationGracePeriodSeconds: 120
  # Workload kind: deployment (Kubernetes Deployment) or rollout (Argo Rollout). Stateful
  # services use StatefulSet.
  type: deployment
  # Integration API credentials username (required if Smart Activation is enabled)
  username: admin@noemail.com

# Execution Service configuration — handles selection rule execution and job processing
executionservice:
  # Autoscaling (hpa or keda).
  autoscaling:
    # Enable horizontal pod autoscaling
    enabled: false
    # KEDA Prometheus trigger settings (autoscaling.type=keda). serverAddress and query are
    # operator-supplied.
    kedaScaledObject:
      # HPA scaling behavior (scaleUp/scaleDown stabilization and policies).
      behavior:
        # Scale-down behavior.
        scaleDown:
          # Scale-down policy.
          policies:
            # Length of the policy period in seconds.
            periodSeconds: 60
            # Scaling policy type: Percent or Pods.
            type: Percent
            # Amount the policy may change the replica count per period.
            value: 50
          # Seconds of metric history considered before a scaleDown decision.
          stabilizationWindowSeconds: 300
        # Scale-up behavior.
        scaleUp:
          # Scale-up policy.
          policies:
            # Length of the policy period in seconds.
            periodSeconds: 60
            # Scaling policy type: Percent or Pods.
            type: Percent
            # Amount the policy may change the replica count per period.
            value: 100
          # Seconds of metric history considered before a scaleUp decision.
          stabilizationWindowSeconds: 300
      fallback:
        failureThreshold: 3
        replicas: 2
      maxReplicaCount: 10
      metricName: execution_max_thread_count
      minReplicaCount: 2
      pollingInterval: 30
      # PromQL query. Required when autoscaling.type=keda.
      query: ''
      # Prometheus server URL. Required when autoscaling.type=keda.
      serverAddress: ''
      terminationGracePeriodSeconds: 120
      threshold: '80'
      useTriggerAuthentication: true
    # Maximum number of replicas
    maxReplicas: 5
    # Minimum number of replicas
    minReplicas: 2
    # Target CPU utilization percentage for autoscaling
    targetCPUUtilizationPercentage: 80
    # Target average memory utilization percentage for the autoscaler
    targetMemoryUtilizationPercentage: 80
    # Autoscaling type: hpa or keda
    type: hpa
  # Prometheus scrape settings for this service.
  customMetrics:
    # Expose the service metrics endpoint for scraping.
    enabled: false
    # Add the prometheus.io/scrape pod annotation.
    prometheus_scrape: false
  # Enable RPI authentication for this service
  enableRPIAuthentication: true
  # Enable the Execution Service
  enabled: true
  # Extra environment variable.
  extraEnvs:
  # Emit this environment variable.
  - enabled: false
    # Environment variable name.
    name: Plugins__LuxSci__IsSandboxMode
    # Environment variable value.
    value: 'true'
  # Emit this environment variable.
  - enabled: false
    # Environment variable name.
    name: Plugins__SendGrid__EnableSandBoxMode
    # Environment variable value.
    value: 'true'
  # Emit this environment variable.
  - enabled: false
    # Environment variable name.
    name: Plugins__Marigold__CampaignTriggerSendThreadCount
    # Environment variable value.
    value: '16'
  # Emit this environment variable.
  - enabled: false
    # Environment variable name.
    name: RPI_MPULSE_UPSERT_CONTACT_DEBUG
    # Environment variable value.
    value: '1'
  # Emit this environment variable.
  - enabled: false
    # Environment variable name.
    name: RPI_MPULSE_EVENT_UPLOAD_DEBUG
    # Environment variable value.
    value: '1'
  # Emit this environment variable.
  - enabled: false
    # Environment variable name.
    name: LC_ALL
    # Environment variable value.
    value: en_US.UTF-8
  # Emit this environment variable.
  - enabled: false
    # Environment variable name.
    name: LANG
    # Environment variable value.
    value: en_US.UTF-8
  # Emit this environment variable.
  - enabled: false
    # Environment variable name.
    name: LANGUAGE
    # Environment variable value.
    value: en_US.UTF-8
  # Emit this environment variable.
  - enabled: false
    # Environment variable name.
    name: RPI_MPULSE_EVENT_UPLOAD_FAIL_DEBUG
    # Environment variable value.
    value: '0'
  # Emit this environment variable.
  - enabled: false
    # Environment variable name.
    name: RPI_MPULSE_EVENT_UPLOAD_SCENARIO
    # Environment variable value.
    value: '1,5,2,3,5,7'
  # Emit this environment variable.
  - enabled: false
    # Environment variable name.
    name: RPI_MPULSE_SAVE_MPULSE_EVENT_CONTENT_DEBUG
    # Environment variable value.
    value: '1'
  # Emit this environment variable.
  - enabled: false
    # Environment variable name.
    name: RPI_MPULSE_UPSERT_CONTACT_IMPORT_PATH_DEBUG
    # Environment variable value.
    value: /rpifileoutputdir/mpulse-debug-path
  # Execution Service file-output behavior.
  fileOutput:
    # Allow writing file output to any server location.
    allowAllServerLocations: true
    # Allow per-client file-output directory overrides.
    allowClientOverrides: true
  # Internal cache for execution state
  internalCache:
    # Azure Blob storage settings (when provider=azureblob)
    azureStorageSettings:
      # Azure Storage account name
      accountName: my_storage_account_name
      # Azure Blob container name
      containerName: rpi
      # Use cloud identity for authentication
      useCloudIdentity: false
    # Enable internal cache
    enabled: true
    # Fail startup if the cache connection cannot be established.
    failOnCacheConnectionError: true
    # Filesystem state-persistence directory override (when provider=filesystem).
    fileSystem:
      # State directory path used when OverrideDirectoryPath is true.
      DirectoryPathOverride: /rpifileoutputdirectory
      # When true, inject the state directory path override env vars; when false (default)
      # they are not injected.
      OverrideDirectoryPath: false
    # Maximum cache connection retry attempts.
    maxNumberRetries: 100
    # Delay (hh:mm:ss) between cache connection retries.
    maxRetryDelay: '00:01:00'
    # Cache provider type
    provider: filesystem
    # Redis endpoint settings (when a Redis cache provider is used).
    redisSettings:
      # Redis server address.
      ipAddress: localhost
  # Execution Service job and workflow execution tuning.
  jobExecution:
    # Write task lifecycle events to the audit log.
    auditTaskEvents: true
    # Default maintenance-mode buffer (hh:mm:ss).
    defaultMaintenanceModeBufferTime: '00:05:00'
    # Restrict which jobs and clients this Execution Service processes (empty = process all).
    executionFilterRules:
      # Client IDs this Execution Service is limited to.
      clients: []
      # Per-job-type allowlist. Each item: {type, jobNames: [ ... ]}.
      jobRules: []
    # Grace period (hh:mm:ss) to wait for in-flight activity before shutdown.
    executionShutdownWaitForActivity: '00:08:00'
    # LuxSci channel throttling.
    luxSci:
      # Maximum concurrent LuxSci API requests per account.
      maxConcurrentApiRequestsPerAccount: 5
      # Maximum parallel LuxSci operations.
      maxDegreeOfParallelism: 10
      # Days of LuxSci history to backtrack when collecting results.
      numberOfDaysToBacktrack: 30
    # Maximum smart-asset instances included in offer reporting.
    maxSmartAssetInstancesForOfferReporting: '100000'
    # Maximum concurrent worker threads per Execution Service replica.
    maxThreadsPerExecutionService: 100
    # Allow custom SQL reserved-word overrides.
    overrideCustomSQLReservedWords: false
    # Persist per-task execution detail records.
    persistTaskExecutionDetails: false
    # URI prefix for the RPDM Operational API.
    rpdmOApiPrefixUri: /v1/
    # Timeout in seconds for Redpoint Data Management OAPI requests.
    rpdmOApiRequestTimeout: '200'
    # Task execution timeout in seconds.
    taskTimeout: 60
    # Interval (seconds) between trigger criteria checks.
    triggerCheckCriteriaInterval: 60
    # Days a trigger may remain inactive before it is skipped.
    triggersMaxDaysInactive: 180
    # Workflow prioritization queue controls.
    workflowPrioritization:
      # Enable workflow prioritization.
      enabled: true
      # Maximum concurrent prioritized workflow activities.
      maxConcurrentWorkflowActivities: 100
      # Maximum time (hh:mm:ss) an activity may wait in the priority queue.
      maximumQueueTime: '24:00:00'
  # Execution Service log levels and log-forwarding sinks.
  logging:
    # Console log level.
    Console: Error
    # Database log sink level.
    database: Error
    # Default log level.
    default: Error
    # Loggly log forwarding. Set enabled: true and populate Secret key Loggly_ApiKey.
    loggly:
      # Enable Loggly forwarding.
      enabled: false
      # Loggly log ingest endpoint.
      httpsEndpoint: 'https://logs-01.loggly.com'
      # Default forwarded level.
      logLevelDefault: Information
      # RPIError level.
      rpiError: Information
      # RPITrace level.
      rpiTrace: Error
    # Microsoft namespace log level.
    microsoft: Warning
    # Microsoft.Hosting.Lifetime log level.
    microsoftHostingLifetime: Warning
    # New Relic log forwarding. Set enabled: true and populate Secret key NewRelic_ApiKey.
    newRelic:
      # Enable New Relic forwarding.
      enabled: false
      # New Relic log ingest endpoint.
      httpsEndpoint: 'https://log-api.newrelic.com/log/v1'
      # Default forwarded level.
      logLevelDefault: Information
      # RPIError level.
      rpiError: Information
      # RPITrace level.
      rpiTrace: Error
    # Database RPIError level.
    rpiError: Error
    # Database RPITrace level.
    rpiTrace: Error
  # Mercury integration. Disabled by default; set enabled: true and populate Secret key
  # Mercury_Password.
  mercury:
    # Mercury service address.
    address: ''
    # Enable the Mercury integration.
    enabled: false
    # Mercury username.
    username: ''
  # Operational database resilience settings.
  operationalDatabase:
    # Maximum operational-database connection retry attempts.
    maxRetryCount: 12
    # Delay (hh:mm:ss) between operational-database retries.
    maxRetryDelay: '00:01:00'
  # Extra annotations added to this service's pods.
  podAnnotations: {}
  # PodDisruptionBudget for this service.
  podDisruptionBudget:
    # Create a PodDisruptionBudget for the workload.
    enabled: false
    # Minimum pods that must stay available during voluntary disruption (count or percentage).
    minAvailable: 1
  # Extra labels added to this service's pods.
  podLabels: {}
  # Azure Web PubSub. Disabled by default; set enabled: true and populate Secret key
  # PubSub_ConnectionString.
  pubSub:
    # Azure PubSub settings.
    azureSettings:
      # Azure Web PubSub endpoint URL.
      endpoint: ''
    # Enable Web PubSub.
    enabled: false
    # PubSub provider.
    provider: Azure
  # Number of Execution Service pod replicas
  replicas: 1
  # CPU and memory resource requests and limits
  resources:
    # Apply the requests and limits below to the container. false deploys the container
    # without resource constraints.
    enabled: true
    # Resource limits (maximum allocation)
    limits:
      # Memory limit (e.g., '1Gi', '3Gi')
      memory: 3Gi
      # CPU limit (e.g., '1', '2')
      cpu: ''
    # Resource requests (guaranteed allocation)
    requests:
      # CPU request (e.g., '500m', '1')
      cpu: 50m
      # Memory request (e.g., '512Mi', '1Gi')
      memory: 256Mi
  # Argo Rollout settings, used when type is rollout.
  rollout:
    # Promote the new revision automatically once it is healthy.
    autoPromotionEnabled: true
    # Number of old ReplicaSets retained for rollback.
    revisionHistoryLimit: 3
  # Seed-service resilience settings.
  seedService:
    # Maximum retries when the seed service fails to load.
    maxNumberRetries: '100'
    # Delay (hh:mm:ss) between seed-service retries.
    maxRetryDelay: '00:01:00'
    # Seed-service in-memory cache size.
    memoryCacheSize: '10'
  # ServiceAccount for this service.
  serviceAccount:
    # Create a dedicated ServiceAccount for the service; cloud identity annotations are
    # applied to it.
    enabled: true
  # This Execution Service's externally reachable host and port (used for callbacks).
  serviceHost:
    # Emit RPI__ServiceHostName / RPI__ServiceHostPortNumber (default false).
    enabled: false
    # Service host name (empty = derived at runtime).
    name: rpi-executionservice
    # Service host port.
    portNumber: 80
  # Custom SystemVariables exposed to workflows. Each item: {name, value}.
  systemVariables: []
  # Seconds Kubernetes waits for the pod to stop gracefully before killing it.
  terminationGracePeriodSeconds: 120
  # Workload kind: deployment (Kubernetes Deployment) or rollout (Argo Rollout). Stateful
  # services use StatefulSet.
  type: deployment
  # User management mode. Enabling Keycloak (OpenIdProviders) forces external management on.
  userManagement:
    # Use an external identity provider for user management.
    useExternalUserManagement: false
    # Use RPI native user management.
    useNativeUserManagement: true

# Node Manager service configuration — manages cluster node operations
nodemanager:
  # Horizontal Pod Autoscaler configuration
  autoscaling:
    # Enable horizontal pod autoscaling
    enabled: false
    # Maximum number of replicas
    maxReplicas: 5
    # Minimum number of replicas
    minReplicas: 2
    # Target CPU utilization percentage for autoscaling
    targetCPUUtilizationPercentage: 80
    # Target average memory utilization percentage for the autoscaler
    targetMemoryUtilizationPercentage: 80
    # Autoscaling type: hpa or keda
    type: hpa
  # Prometheus scrape settings for this service.
  customMetrics:
    # Expose the service metrics endpoint for scraping.
    enabled: false
    # Add the prometheus.io/scrape pod annotation.
    prometheus_scrape: false
  # Enable RPI authentication for this service
  enableRPIAuthentication: true
  # Enable the Node Manager service
  enabled: true
  # Node Manager file-output behavior.
  fileOutput:
    # Allow writing file output to any server location.
    allowAllServerLocations: true
    # Allow per-client file-output directory overrides.
    allowClientOverrides: true
  # Node Manager log levels and log-forwarding sinks.
  logging:
    # Console log level.
    Console: Error
    # Database log sink level.
    database: Error
    # Default log level.
    default: Error
    # Loggly log forwarding. Set enabled: true and populate Secret key Loggly_ApiKey.
    loggly:
      # Enable Loggly forwarding.
      enabled: false
      # Loggly log ingest endpoint.
      httpsEndpoint: 'https://logs-01.loggly.com'
      # Default forwarded level.
      logLevelDefault: Information
      # RPIError level.
      rpiError: Information
      # RPITrace level.
      rpiTrace: Error
    # Microsoft namespace log level.
    microsoft: Warning
    # Microsoft.Hosting.Lifetime log level.
    microsoftHostingLifetime: Warning
    # New Relic log forwarding. Set enabled: true and populate Secret key NewRelic_ApiKey.
    newRelic:
      # Enable New Relic forwarding.
      enabled: false
      # New Relic log ingest endpoint.
      httpsEndpoint: 'https://log-api.newrelic.com/log/v1'
      # Default forwarded level.
      logLevelDefault: Information
      # RPIError level.
      rpiError: Information
      # RPITrace level.
      rpiTrace: Error
    # Database RPIError level.
    rpiError: Error
    # Database RPITrace level.
    rpiTrace: Error
  # Mercury integration. Set enabled: true and populate Secret key Mercury_Password.
  mercury:
    # Mercury service address.
    address: ''
    # Enable the Mercury integration.
    enabled: false
    # Mercury username.
    username: ''
  # Operational database resilience settings.
  operationalDatabase:
    # Maximum operational-database connection retry attempts.
    maxRetryCount: 12
    # Delay (hh:mm:ss) between operational-database retries.
    maxRetryDelay: '00:01:00'
  # Extra annotations added to this service's pods.
  podAnnotations: {}
  # PodDisruptionBudget for this service.
  podDisruptionBudget:
    # Create a PodDisruptionBudget for the workload.
    enabled: false
    # Minimum pods that must stay available during voluntary disruption (count or percentage).
    minAvailable: 1
  # Extra labels added to this service's pods.
  podLabels: {}
  # Azure Web PubSub. Set enabled: true and populate Secret key PubSub_ConnectionString.
  pubSub:
    # Azure PubSub settings.
    azureSettings:
      # Azure Web PubSub endpoint URL.
      endpoint: ''
    # Enable Web PubSub.
    enabled: false
    # PubSub provider.
    provider: Azure
  # Number of Node Manager pod replicas
  replicas: 1
  # CPU and memory resource requests and limits
  resources:
    # Apply the requests and limits below to the container. false deploys the container
    # without resource constraints.
    enabled: true
    # Resource limits (maximum allocation)
    limits:
      # Memory limit (e.g., '1Gi', '3Gi')
      memory: 3Gi
      # CPU limit (e.g., '1', '2')
      cpu: ''
    # Resource requests (guaranteed allocation)
    requests:
      # CPU request (e.g., '500m', '1')
      cpu: 50m
      # Memory request (e.g., '512Mi', '1Gi')
      memory: 256Mi
  # Argo Rollout settings, used when type is rollout.
  rollout:
    # Promote the new revision automatically once it is healthy.
    autoPromotionEnabled: true
    # Number of old ReplicaSets retained for rollback.
    revisionHistoryLimit: 3
  # ServiceAccount for this service.
  serviceAccount:
    # Create a dedicated ServiceAccount for the service; cloud identity annotations are
    # applied to it.
    enabled: true
  # This Node Manager's externally reachable host and port.
  serviceHost:
    # Emit RPI__ServiceHostName / RPI__ServiceHostPortNumber (default false).
    enabled: false
    # Service host name.
    name: rpi-nodemanager
    # Service host port.
    portNumber: 80
  # Custom SystemVariables exposed to workflows. Each item: {name, value}.
  systemVariables: []
  # Seconds Kubernetes waits for the pod to stop gracefully before killing it.
  terminationGracePeriodSeconds: 120
  # Workload kind: deployment (Kubernetes Deployment) or rollout (Argo Rollout). Stateful
  # services use StatefulSet.
  type: deployment
  # User management mode. Enabling Keycloak (OpenIdProviders) forces external management on.
  userManagement:
    # Use an external identity provider for user management.
    useExternalUserManagement: false
    # Use RPI native user management.
    useNativeUserManagement: true

# Queue Reader service configuration — processes messages from the realtime queue
queuereader:
  # Horizontal Pod Autoscaler configuration
  autoscaling:
    # Enable horizontal pod autoscaling
    enabled: false
    # Maximum number of replicas
    maxReplicas: 5
    # Minimum number of replicas
    minReplicas: 2
    # Target CPU utilization percentage for autoscaling
    targetCPUUtilizationPercentage: 80
    # Target average memory utilization percentage for the autoscaler
    targetMemoryUtilizationPercentage: 80
    # Autoscaling type: hpa or keda
    type: hpa
  # Prometheus scrape settings for this service.
  customMetrics:
    # Expose the service metrics endpoint for scraping.
    enabled: false
    # Add the prometheus.io/scrape pod annotation.
    prometheus_scrape: true
  # Enable the Queue Reader service
  enabled: true
  # Queue path for error messages
  errorQueuePath: listenerQueueError
  # Queue Reader file-output behavior.
  fileOutput:
    # Allow writing file output to any server location.
    allowAllServerLocations: true
    # Allow per-client file-output directory overrides.
    allowClientOverrides: true
  # Chart-managed Redis that coordinates work across Queue Reader replicas when
  # realtimeConfiguration.isDistributed is true. The cache provider is Redis by application
  # default; the Queue Reader does not use InternalCache state persistence.
  internalCache:
    # Chart-managed Redis StatefulSet settings. The Queue Reader's connection string is
    # generated into the internal-services Secret (QueueService_RedisCache_ConnectionString),
    # never taken from values.
    redisSettings:
      # PodDisruptionBudget for the chart-managed Queue Reader Redis.
      podDisruptionBudget:
        # Create a PodDisruptionBudget for the workload.
        enabled: false
        # Minimum pods that must stay available during voluntary disruption (count or
        # percentage).
        minAvailable: 1
      # Replicas of the chart-managed Queue Reader Redis.
      replicas: 1
      # Resource requests and limits for the chart-managed Queue Reader Redis.
      resources:
        # Apply the requests and limits below to the container. false deploys the container
        # without resource constraints.
        enabled: true
        # Resource limits (maximum allocation)
        limits:
          # Memory limit (e.g., '1Gi', '3Gi')
          memory: 3Gi
          # CPU limit (e.g., '1', '2')
          cpu: ''
        # Resource requests (guaranteed allocation)
        requests:
          # CPU request (e.g., '500m', '1')
          cpu: 100m
          # Memory request (e.g., '512Mi', '1Gi')
          memory: 256Mi
      # Persistent volume claim template for the chart-managed Queue Reader Redis.
      volumeClaimTemplates:
        # Provision a PersistentVolumeClaim per replica through the StatefulSet; false expects
        # an existing claim.
        enabled: true
        # Requested volume size (e.g. 100Gi).
        storage: 100Gi
        # StorageClass for the claim; unset uses the cluster default.
        storageClassName: ''
        # Access mode for the claim (default ReadWriteOnce).
        accessModes: ''
  # Internal message queue used by the queue reader.
  internalQueues:
    rabbitmqSettings:
      # Resource requests and limits for the chart-managed Queue Reader RabbitMQ.
      resources:
        # Apply the requests and limits below to the container. false deploys the container
        # without resource constraints.
        enabled: true
        # Resource limits (maximum allocation)
        limits:
          # Memory limit (e.g., '1Gi', '3Gi')
          memory: 3Gi
          # CPU limit (e.g., '1', '2')
          cpu: ''
        # Resource requests (guaranteed allocation)
        requests:
          # CPU request (e.g., '500m', '1')
          cpu: 100m
          # Memory request (e.g., '512Mi', '1Gi')
          memory: 256Mi
      # RabbitMQ username. Defaults to the release namespace.
      username: ''
      # RabbitMQ virtual host used by the chart-managed Queue Reader broker.
      virtualhost: /
      # Persistent volume claim template for the chart-managed Queue Reader RabbitMQ.
      volumeClaimTemplates:
        # Provision a PersistentVolumeClaim per replica through the StatefulSet; false expects
        # an existing claim.
        enabled: true
        # Requested volume size (e.g. 100Gi).
        storage: 100Gi
        # StorageClass for the claim; unset uses the cluster default.
        storageClassName: ''
        # Access mode for the claim (default ReadWriteOnce).
        accessModes: ''
  # Process realtime cache messages.
  isCacheProcessingEnabled: true
  # Process callback-service messages from the external queue provider.
  isCallbackServiceProcessingEnabled: true
  # Process realtime event messages.
  isEventProcessingEnabled: true
  # Process web-form submission messages.
  isFormProcessingEnabled: true
  # Days a failed listener-queue message is retained before it is discarded.
  listenerQueueErrorTTLDays: 14
  # Days an inactive listener-queue entry is retained.
  listenerQueueNonActiveTTLDays: 14
  # Queue Reader log levels and log-forwarding sinks.
  logging:
    # Console log level.
    Console: Error
    # Database log sink level.
    database: Error
    # Default log level.
    default: Error
    # Loggly log forwarding. Set enabled: true and populate Secret key Loggly_ApiKey.
    loggly:
      # Enable Loggly forwarding.
      enabled: false
      # Loggly log ingest endpoint.
      httpsEndpoint: 'https://logs-01.loggly.com'
      # Default forwarded level.
      logLevelDefault: Information
      # RPIError level.
      rpiError: Information
      # RPITrace level.
      rpiTrace: Error
    # Microsoft namespace log level.
    microsoft: Warning
    # Microsoft.Hosting.Lifetime log level.
    microsoftHostingLifetime: Warning
    # New Relic log forwarding. Set enabled: true and populate Secret key NewRelic_ApiKey.
    newRelic:
      # Enable New Relic forwarding.
      enabled: false
      # New Relic log ingest endpoint.
      httpsEndpoint: 'https://log-api.newrelic.com/log/v1'
      # Default forwarded level.
      logLevelDefault: Information
      # RPIError level.
      rpiError: Information
      # RPITrace level.
      rpiTrace: Error
    # Database RPIError level.
    rpiError: Error
    # Database RPITrace level.
    rpiTrace: Error
  # Grace period (hh:mm:ss) before maintenance mode takes effect.
  maintenanceModeBufferTime: '00:01:00'
  # Maximum messages read from the queue per batch.
  maxBatchSize: 50
  # Queue path for non-active messages
  nonActiveQueuePath: listenerQueueNonActive
  # Operational database resilience settings.
  operationalDatabase:
    # Maximum operational-database connection retry attempts.
    maxRetryCount: 12
    # Delay (hh:mm:ss) between operational-database retries.
    maxRetryDelay: '00:01:00'
  # Partitioned-queue handling.
  partitionHandler:
    # Lifetime (hh:mm:ss) of the message-deduplication cache.
    deduplicationCacheTTL: '01:00:00'
    # Lifetime (hh:mm:ss) of stored partition offsets.
    offsetPositionTTL: '23:59:59'
    # How long (hh:mm:ss) a partition lock is held.
    partitionLockDuration: '00:02:00'
  # Extra annotations added to this service's pods.
  podAnnotations: {}
  # PodDisruptionBudget for this service.
  podDisruptionBudget:
    # Create a PodDisruptionBudget for the workload.
    enabled: false
    # Minimum pods that must stay available during voluntary disruption (count or percentage).
    minAvailable: 1
  # Extra labels added to this service's pods.
  podLabels: {}
  # Azure Web PubSub. Set enabled: true and populate Secret key PubSub_ConnectionString.
  pubSub:
    # Azure PubSub settings.
    azureSettings:
      # Azure Web PubSub endpoint URL.
      endpoint: ''
    # Enable Web PubSub.
    enabled: false
    # PubSub provider.
    provider: Azure
  # Enable the queue listener.
  queueListenerEnabled: true
  # Realtime processing configuration
  realtimeConfiguration:
    # Distribute queue processing across Queue Reader replicas. Deploys the chart-managed
    # Redis (workload coordination: locks, partition offsets, deduplication) and RabbitMQ, and
    # wires the Queue Reader to them.
    isDistributed: false
    # RPI client IDs (GUIDs) this queue reader processes.
    tenantIds: []
  # Number of Queue Reader pod replicas
  replicas: 1
  # CPU and memory resource requests and limits
  resources:
    # Apply the requests and limits below to the container. false deploys the container
    # without resource constraints.
    enabled: true
    # Resource limits (maximum allocation)
    limits:
      # Memory limit (e.g., '1Gi', '3Gi')
      memory: 3Gi
      # CPU limit (e.g., '1', '2')
      cpu: ''
    # Resource requests (guaranteed allocation)
    requests:
      # CPU request (e.g., '500m', '1')
      cpu: 50m
      # Memory request (e.g., '512Mi', '1Gi')
      memory: 256Mi
  # Argo Rollout settings, used when type is rollout.
  rollout:
    # Promote the new revision automatically once it is healthy.
    autoPromotionEnabled: true
    # Number of old ReplicaSets retained for rollback.
    revisionHistoryLimit: 3
  # Seed-service resilience settings.
  seedService:
    # Maximum retries when the seed service fails to load.
    maxNumberRetries: '100'
    # Delay (hh:mm:ss) between seed-service retries.
    maxRetryDelay: '00:01:00'
    # Seed-service in-memory cache size.
    memoryCacheSize: '10'
  # ServiceAccount for this service.
  serviceAccount:
    # Create a dedicated ServiceAccount for the service; cloud identity annotations are
    # applied to it.
    enabled: true
  # This Queue Reader's own host and port (used for callbacks).
  serviceHost:
    # Emit RPI__ServiceHostName / RPI__ServiceHostPortNumber (default false).
    enabled: false
    # Service host name (empty = derived at runtime).
    name: rpi-queuereader
    # Service host port.
    portNumber: 80
  # Custom SystemVariables exposed to workflows. Each item: {name, value}.
  systemVariables: []
  # Seconds Kubernetes waits for the pod to stop gracefully before killing it.
  terminationGracePeriodSeconds: 120
  # Worker threads processing queue messages.
  threadPoolSize: 10
  # Minutes before a message-processing operation times out.
  timeoutMinutes: 60
  # Workload kind: deployment (Kubernetes Deployment) or rollout (Argo Rollout). Stateful
  # services use StatefulSet.
  type: deployment
  # Lock messages while they are processed so parallel readers do not process the same
  # message.
  useMessageLocks: true
  # User management mode. Enabling Keycloak (OpenIdProviders) forces external management on.
  userManagement:
    # Use an external identity provider for user management.
    useExternalUserManagement: false
    # Use RPI native user management.
    useNativeUserManagement: true

# Realtime API service configuration — handles real-time decisioning, caching, and queue
# processing
realtimeapi:
  # Allowed CORS origins for the Realtime API
  CORSOrigins:
  - '*'
  # Include the visitor IP address in cache output.
  CacheOutputCollectIPAddress: true
  # Cache-output exclusion entries.
  CacheOutputExclusions: []
  # Store submitted web-form data in the realtime cache.
  CacheWebFormData: false
  # Timeout in milliseconds for loading cached attribute lists. 0 uses the application
  # default.
  CachedAttributeLoadTimeoutMS: 0
  # Emit events when visitor profiles are merged.
  EnableProfileMergeEvents: true
  # Number of days to persist web events. The chart always sets this value; override it to
  # change the retention.
  EventDaysToPersistOverride: 365
  # Seconds event-listening data is held in the local cache.
  EventListeningLocalCacheDuration: 60
  # Hash visitor IDs before storing them.
  HashVisitorID: false
  # Maximum number of event metadata instances retained.
  MaxNoEventMetadataInstances: 100
  # Maximum number of devices tracked per visitor.
  MaxNoVisitorDevicesAllowed: 6
  # Days of message history retained in the visitor profile.
  MessageHistoryDaysInProfile: 365
  # Maximum message-history records retained per visitor profile.
  MessageHistoryProfileRecordLimit: 100
  # Minutes to cache recommendation results.
  NoMinsCacheRecommendResults: 60
  # Minutes to cache selection results.
  NoMinsCacheSelectionResults: 60
  # Address of the Interaction Realtime Agent. Unset leaves the application default.
  RealtimeAgentAddress: ''
  # Path to the in-process Realtime Agent assembly. Unset leaves the application default.
  RealtimeAgentInProcessPath: ''
  # Optional Domain attribute for the Realtime server visitor cookie. Unset leaves the cookie
  # host-only (the variable is not emitted).
  RealtimeServerCookieDomain: ''
  # Enable the Realtime server visitor cookie.
  RealtimeServerCookieEnabled: false
  # Realtime server visitor cookie lifetime in days.
  RealtimeServerCookieExpires: 60
  # Mark the Realtime server visitor cookie HttpOnly.
  RealtimeServerCookieHttpOnly: false
  # Name of the Realtime server visitor cookie.
  RealtimeServerCookieName: rg-visitor
  # RedPoint ML client identifier. Unset leaves the application default.
  RedPointMLClientID: ''
  # RedPoint ML service address. Unset leaves the application default.
  RedPointMLServiceAddress: ''
  # Parameter name carrying the region language code. Unset leaves the application default.
  RegionLanguageCodeParameter: ''
  # Persist the visitor profile after returning a decision response.
  SaveProfilePostDecisionResponse: false
  # Minutes between requests that start a new page visit.
  ThresholdBetweenPageVisitsMinutes: 1
  # Minutes of inactivity after which a new site visit begins.
  ThresholdBetweenSiteVisitsMinutes: 120
  # Record the merge on the source profile when profiles are merged.
  TrackProfileMergeInSourceProfile: true
  # Web visitor cache duration in minutes. 0 uses the application default.
  WebVisitorCacheDuration: 0
  # Realtime agent configuration.
  agentConfig:
    cachedSelectionRuleExpiry: 120
    traceLogEnabled: false
  # Realtime API authentication configuration
  authentication:
    # Basic authentication settings
    basic:
      # Enable forms basic auth
      forms: true
      # Enable listener queue basic auth
      listenerQueue: true
      # Enable recommendations basic auth
      recommendations: true
      # Enable standard basic auth
      standard: false
    # OAuth authentication settings
    oauth:
      # Access token lifetime in seconds
      accessTokenLifetimeSeconds: 360
      # Refresh token lifetime in seconds
      refreshTokenLifetimeSeconds: 360
    # Authentication type for the Realtime API
    type: basic
  # Horizontal Pod Autoscaler configuration
  autoscaling:
    # Enable horizontal pod autoscaling
    enabled: false
    # Maximum number of replicas
    maxReplicas: 5
    # Minimum number of replicas
    minReplicas: 2
    # Target CPU utilization percentage for autoscaling
    targetCPUUtilizationPercentage: 80
    # Target average memory utilization percentage for the autoscaler
    targetMemoryUtilizationPercentage: 80
    # Autoscaling type: hpa or keda
    type: hpa
  # Publish cache output to the cache-output queue.
  cacheOutputQueueEnabled: true
  # Real-time cache provider configuration
  cacheProvider:
    # Enable the real-time cache provider
    enabled: true
    # Google Bigtable cache provider settings
    googlebigtable:
      # Bigtable instance ID
      instanceId: <my-bigtable-instance-id>
      # Google Cloud project ID
      projectId: <my-bigtable-project-id>
    # MongoDB cache provider settings
    mongodb:
      # MongoDB authentication: default (connection string from the shared Secret) or iamRole
      # (MONGODB-AWS via IRSA / Pod Identity).
      authMechanism: default
      # MongoDB collection name
      collectionName: <my-realtime-cache-collection>
      # MongoDB database name
      databaseName: <my-realtime-cache-db>
      # AWS region for the STS endpoint (authMechanism=iamRole only).
      region: us-east-1
      # IAM role ARN for MONGODB-AWS (authMechanism=iamRole only).
      roleArn: ''
    # Cache provider type. Empty resolves to the platform default: google -> googlebigtable,
    # azure/amazon/selfhosted -> mongodb.
    provider: ''
    # Redis cache provider settings
    redis:
      # Internal cache StatefulSet tuning (resources, volumeClaimTemplates).
      redisSettings:
        # Resource requests and limits for the chart-managed Realtime Redis.
        resources:
          # Apply the requests and limits below to the container. false deploys the container
          # without resource constraints.
          enabled: true
          # Resource limits (maximum allocation)
          limits:
            # Memory limit (e.g., '1Gi', '3Gi')
            memory: 3Gi
            # CPU limit (e.g., '1', '2')
            cpu: ''
          # Resource requests (guaranteed allocation)
          requests:
            # CPU request (e.g., '500m', '1')
            cpu: 100m
            # Memory request (e.g., '512Mi', '1Gi')
            memory: 256Mi
        # Persistent volume claim template for the chart-managed Realtime Redis.
        volumeClaimTemplates:
          # Provision a PersistentVolumeClaim per replica through the StatefulSet; false
          # expects an existing claim.
          enabled: true
          # Requested volume size (e.g. 100Gi).
          storage: 50Gi
      # Redis deployment type: internal (chart-managed) or external (BYO)
      type: internal
  # Per-client Realtime API address overrides. Requires realtimeapi.multitenant=true (only
  # meaningful with multiple Realtime API instances); render fails if set on a single-tenant
  # deployment. Clients not listed use the cluster-wide address.
  clientAddressOverrides: []
  # Prometheus scrape settings for this service.
  customMetrics:
    # Expose the service metrics endpoint for scraping.
    enabled: false
    # Add the prometheus.io/scrape pod annotation.
    prometheus_scrape: true
  # Custom Realtime plugins configuration
  customPlugins:
    # Enable custom realtime plugins
    enabled: false
    # List of custom plugin configurations
    list: []
  # Per-DataMap overrides. An empty Cache inherits the effective cacheProvider.provider.
  dataMaps:
    messageHistory:
      # Cache assignment; empty inherits the effective cacheProvider.provider.
      Cache: ''
      CompressData: false
      DaysToPersist: 9999
    nonVisitorData:
      # Cache assignment; empty inherits the effective cacheProvider.provider.
      Cache: ''
      CompressData: false
      DaysToPersist: 365
    offerHistory:
      # Cache assignment; empty inherits the effective cacheProvider.provider.
      Cache: ''
      CompressData: false
      DaysToPersist: 9999
    productRecommendation:
      # Cache assignment; empty inherits the effective cacheProvider.provider.
      Cache: ''
      CompressData: false
      DaysToPersist: 365
    visitorBackup:
      # Cache assignment; empty inherits the effective cacheProvider.provider.
      Cache: ''
      CompressData: false
      DaysToPersist: 9999
    visitorHistory:
      # Cache assignment; empty inherits the effective cacheProvider.provider.
      Cache: ''
      CompressData: true
      DaysToPersist: 365
    visitorProfile:
      # Cache assignment; empty inherits the effective cacheProvider.provider.
      Cache: ''
      CompressData: true
      DaysToPersist: 365
    visitorReadonlyParameters:
      # Cache assignment; empty inherits the effective cacheProvider.provider.
      Cache: ''
      CompressData: false
      DaysToPersist: 9999
      KeySuffix: _p
  # Seconds a decision result is cached.
  decisionCacheDuration: 60
  # Return audit metrics in response headers.
  enableAuditMetricsInHeaders: true
  # Enable event listening.
  enableEventListening: true
  # Serve the Realtime API help pages.
  enableHelpPages: true
  # Enable the Realtime API service
  enabled: true
  # File output behaviour.
  fileOutput:
    allowAllServerLocations: true
    allowClientOverrides: true
  # Realtime geolocation settings (weather / location enrichment). Defaults use the native
  # Azure provider; a custom provider can be supplied via the plugin fields. The provider
  # APIKey is not set here - it is supplied via the shared RPI Secret key
  # RealtimeAPI_Geolocation_APIKey (kubernetes/csi) or the cloud vault (sdk).
  geolocation:
    # Minutes to cache resolved coordinates
    coordsCacheTimespanMinutes: 10
    # Enable geolocation config injection. When false (default) no geolocation env vars are
    # emitted and no APIKey secret is referenced. When true, the settings below apply and
    # RealtimeAPI_Geolocation_APIKey becomes a required secret key (kubernetes/csi).
    enabled: false
    # Optional IP-address-based geolocation lookup
    ipLookup:
      # Minutes to cache coordinates resolved via IP lookup
      coordsCacheTimespanMinutesIPLookup: 30
      # Enable IP-based geolocation lookup
      enableGeoIPLookup: false
      # Assembly name of a custom IP-lookup plugin
      pluginAssembly: ''
      # Key/value settings passed to the custom IP-lookup plugin
      pluginSettings: []
      # Fully qualified type of the custom IP-lookup plugin
      pluginType: ''
    # Assembly name of a custom geolocation provider plugin (blank uses the native provider)
    pluginAssembly: ''
    # Key/value settings passed to the custom geolocation provider plugin
    pluginSettings: []
    # Fully qualified type of the custom geolocation provider plugin
    pluginType: ''
    # Geolocation provider. Native value is Azure; any other value denotes a custom provider
    # configured via the plugin fields.
    provider: Azure
    # Units for weather enrichment
    weatherUnits: imperial
  # Visitor and device ID validation.
  idValidation:
    # Device ID validation rules.
    deviceID:
      # Allow letters in deviceID values.
      enableLetters: true
      # Allow digits in deviceID values.
      enableNumbers: true
      # Maximum deviceID length.
      maximumLength: 36
      # Minimum deviceID length.
      minimumLength: 1
      # Additional characters permitted in deviceID values.
      permittedCharacters:
      - '-'
      - _
      - /
      - .
      - '@'
      - '#'
      - '&'
      - '?'
    # Validate incoming device IDs against the deviceID rules.
    enableDeviceIDValidation: true
    # Validate incoming visitor IDs against the visitorID rules.
    enableVisitorIDValidation: true
    # Visitor ID validation rules.
    visitorID:
      # Allow letters in visitorID values.
      enableLetters: true
      # Allow digits in visitorID values.
      enableNumbers: true
      # Maximum visitorID length.
      maximumLength: 36
      # Minimum visitorID length.
      minimumLength: 1
      # Additional characters permitted in visitorID values.
      permittedCharacters:
      - '-'
      - _
      - /
      - .
      - '@'
      - '#'
      - '&'
      - '?'
  # How a known visitor's profile is keyed once they identify themselves (querystring, cached
  # attribute list, or Realtime cache offer).
  identitySettings:
    # Additional keys that can also identify a visitor, linked to the master key via a
    # querystring or a populated Realtime cache
    alternativeKeys: []
    # Cached-attribute-list attribute names to exclude from the merge
    calMergeExclusions: []
    # Alternative names the master key may appear under (e.g. CK for CustomerKey)
    masterKeyAliases: []
    # Principal key used to identify a known visitor's profile (e.g. CustomerKey). Blank keeps
    # the RPI-assigned GUID (the variable is not emitted).
    masterKeyName: ''
    # Merge cached-attribute-list attributes into the visitor profile
    mergeCALAttributes: true
    # Merge querystring parameters into the visitor profile
    mergeParameters: true
    # Querystring parameter names to exclude from the merge
    parameterMergeExclusions: []
  # Realtime API and Realtime Agent log levels.
  logging:
    # Realtime Agent log levels.
    realtimeagent:
      # Console log level.
      console: Error
      # Database log sink level.
      database: Error
      # Default log level.
      default: Error
      # Microsoft namespace log level.
      microsoft: Error
      # Microsoft.Hosting.Lifetime log level.
      microsoftHostingLifetime: Error
      # Database RPIError level.
      rpiError: Error
      # Database RPITrace level.
      rpiTrace: Error
    # Realtime API log levels.
    realtimeapi:
      # Console log level.
      console: 'false'
      # Default log level.
      default: Error
      # Endpoint log level.
      endpoint: Error
      # NLog target name.
      nlogTarget: ''
      # Log level for other namespaces.
      other: Error
      # Plugin log level.
      plugins: Error
      # Shared-library log level.
      shared: Error
  # Run the Realtime API in multi-tenant mode. Required for
  # realtimeapi.clientAddressOverrides.
  multitenant: false
  # Mappings from an inbound parameter to a cached attribute list.
  parameterToDataMappings: []
  # Extra annotations added to this service's pods.
  podAnnotations: {}
  # PodDisruptionBudget for this service.
  podDisruptionBudget:
    # Create a PodDisruptionBudget for the workload.
    enabled: false
    # Minimum pods that must stay available during voluntary disruption (count or percentage).
    minAvailable: 1
  # Extra labels added to this service's pods.
  podLabels: {}
  # Queue listener configurations.
  queueListenerConfiguration: []
  # Real-time queue provider configuration
  queueProvider:
    # Amazon MSK queue provider settings
    amazonmsk:
      # Kafka producer acks mode.
      Acks: None
      # Producer batch size in bytes.
      BatchSize: '1000000'
      # Kafka compression type.
      CompressionType: Snappy
      # Producer linger time.
      LingerTime: 0
      # Producer retry attempts.
      MaxRetryAttempt: 10
      # Enable AWS MSK IAM authentication (True/False).
      UseAwsMsk: 'True'
      # MSK bootstrap servers
      bootstrapServers: '<my-server1.c2.kafka.us-east-1.amazonaws.com:9198>'
    # Amazon SQS queue provider settings
    amazonsqs:
      # SQS credentials type
      credentialsType: accessKey
      # SQS message visibility timeout in seconds.
      visibilityTimeout: '301'
    # Azure Event Hubs queue provider settings
    azureeventhubs:
      # Event Hubs namespace name
      NamespaceName: my_eventhub_namespace_name
      # Partition IDs
      PartitionIds:
      - '0'
      # Receive batch size.
      ReceiveMessageBatchSize: 200
      # Send batch size.
      SendMessageBatchSize: 200
      # Event Hub name
      eventHubName: RPIQueueListener
    # Azure Storage queue provider settings
    azurestorage:
      # Receive-side message visibility timeout.
      receiveVisibilityTimeout: 1
      # Send-side message visibility timeout.
      sendVisibilityTimeout: 1
      # Azure Storage account name
      storageAccountName: myStorageAccountName
      # Use Azure Identity for authentication
      useAzureIdentityAuthentication: false
    # Enable the real-time queue provider
    enabled: true
    # Google Pub/Sub queue provider settings
    googlepubsub:
      # Google Cloud project ID
      projectId: <my-google-project-id>
    # Queue provider type. Empty resolves to the platform default: azure -> azureservicebus,
    # amazon -> amazonsqs, google -> googlepubsub, selfhosted -> rabbitmq.
    provider: ''
    # Queue name configuration for each message type
    queueNames:
      # Cache data output queue name
      cacheOutputQueuePath: RPIWebCacheData
      # Callback API queue name
      callbackServiceQueuePath: RPICallbackApiQueue
      # Web events queue name
      eventsQueuePath: RPIWebEvents
      # Web form submission queue name
      formQueuePath: RPIWebFormSubmission
      # Queue listener queue name
      listenerQueuePath: RPIQueueListener
      # Recommendations queue name
      recommendationsQueuePath: RPIWebRecommendations
    # RabbitMQ queue provider settings
    rabbitmq:
      # RabbitMQ settings. username defaults to the release namespace; hostname applies to
      # external (BYO) RabbitMQ.
      rabbitmqSettings:
        # RabbitMQ host. The chart-managed broker name for type internal; the customer broker
        # host for type external.
        hostname: rpi-realtimeapi-rabbitmq
        # PodDisruptionBudget for the chart-managed Realtime RabbitMQ.
        podDisruptionBudget:
          # Create a PodDisruptionBudget for the workload.
          enabled: false
          # Minimum pods that must stay available during voluntary disruption (count or
          # percentage).
          minAvailable: 1
        # Resource requests and limits for the chart-managed Realtime RabbitMQ.
        resources:
          # Apply the requests and limits below to the container. false deploys the container
          # without resource constraints.
          enabled: true
          # Resource limits (maximum allocation)
          limits:
            # CPU limit (e.g., '1', '2')
            cpu: 1
            # Memory limit (e.g., '1Gi', '3Gi')
            memory: 1Gi
          # Resource requests (guaranteed allocation)
          requests:
            # CPU request (e.g., '500m', '1')
            cpu: 100m
            # Memory request (e.g., '512Mi', '1Gi')
            memory: 256Mi
        # RabbitMQ virtual host.
        virtualhost: /
        # Persistent volume claim template for the chart-managed Realtime RabbitMQ.
        volumeClaimTemplates:
          # Provision a PersistentVolumeClaim per replica through the StatefulSet; false
          # expects an existing claim.
          enabled: true
          # Requested volume size (e.g. 100Gi).
          storage: 100Gi
          # StorageClass for the claim; unset uses the cluster default.
          storageClassName: ''
          # Access mode for the claim (default ReadWriteOnce).
          accessModes: ''
      # RabbitMQ deployment type: internal (chart-managed) or external (BYO)
      type: internal
  # Number of Realtime API pod replicas
  replicas: 1
  # CPU and memory resource requests and limits
  resources:
    # Apply the requests and limits below to the container. false deploys the container
    # without resource constraints.
    enabled: true
    # Resource limits (maximum allocation)
    limits:
      # Memory limit (e.g., '1Gi', '3Gi')
      memory: 3Gi
      # CPU limit (e.g., '1', '2')
      cpu: ''
    # Resource requests (guaranteed allocation)
    requests:
      # CPU request (e.g., '500m', '1')
      cpu: 50m
      # Memory request (e.g., '512Mi', '1Gi')
      memory: 256Mi
  # Argo Rollout settings, used when type is rollout.
  rollout:
    # Promote the new revision automatically once it is healthy.
    autoPromotionEnabled: true
    # Number of old ReplicaSets retained for rollback.
    revisionHistoryLimit: 3
  # RPI Client ID (GUID) for this realtime instance
  rpiClientID: 00000000-0000-0000-0000-000000000000
  # ServiceAccount for this service.
  serviceAccount:
    # Create a dedicated ServiceAccount for the service; cloud identity annotations are
    # applied to it.
    enabled: true
  # This Realtime API's own host and port (used for callbacks).
  serviceHost:
    # Emit RPI__ServiceHostName / RPI__ServiceHostPortNumber (default false).
    enabled: false
    # Service host name (empty = derived at runtime).
    name: rpi-realtimeapi
    # Service host port.
    portNumber: 80
  # Seconds Kubernetes waits for the pod to stop gracefully before killing it.
  terminationGracePeriodSeconds: 120
  # Workload kind: deployment (Kubernetes Deployment) or rollout (Argo Rollout). Stateful
  # services use StatefulSet.
  type: deployment
  # Named visitor views.
  visitorViews: []

