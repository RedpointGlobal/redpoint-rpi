  logging:
    # Log verbosity (e.g. DEBUG, INFO, WARN, ERROR).
    verbosity: DEBUG
  # PodDisruptionBudget for this service.
  podDisruptionBudget:
    # Create a PodDisruptionBudget for the workload.
    enabled: false
    # Minimum pods that must stay available during voluntary disruption (count or percentage).
    minAvailable: 1
  # Number of Auth Service pod replicas
  replicas: 1
  # CPU and memory resource requests and limits
  resources:
    # Apply the requests and limits below to the container. false deploys the container
    # without resource constraints.
    enabled: true
    # JVM options passed to the service (e.g. -Xmx2150m).
    java_opts: -Xmx750m
    # Resource limits (maximum allocation)
    limits:
      # Memory limit (e.g., '1Gi', '3Gi')
      memory: 3Gi
      # CPU limit (e.g., '1', '2')
      cpu: ''
    # Resource requests (guaranteed allocation)
    requests:
      # CPU request (e.g., '500m', '1')
      cpu: 50m
      # Memory request (e.g., '512Mi', '1Gi')
      memory: 256Mi
  # Argo Rollout settings, used when type is rollout.
