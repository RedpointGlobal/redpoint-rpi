    # Promote the new revision automatically once it is healthy.
    autoPromotionEnabled: true
    # Number of old ReplicaSets retained for rollback.
    revisionHistoryLimit: 3
  # Security context for this service; overrides the chart-wide securityContext.
  securityContext:
    # Allow the process to gain more privileges than its parent.
    allowPrivilegeEscalation: false
    # AppArmor profile applied to the container; empty for none.
    appArmorProfile: ''
    # Linux capabilities.
    capabilities:
      # Capabilities dropped from the container.
      drop:
      - ALL
    # Emit the security context on the pod and container.
    enabled: true
    # GID applied to mounted volumes.
    fsGroup: 7777
    # Run the container in privileged mode.
    privileged: false
    # Mount the container root filesystem read-only.
    readOnlyRootFilesystem: true
    # Primary GID of the container process.
    runAsGroup: 7777
    # Require the container to run as a non-root user.
    runAsNonRoot: true
    # UID the container runs as.
    runAsUser: 7777
