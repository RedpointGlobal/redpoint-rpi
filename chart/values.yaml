# ============================================================
# REDPOINT INTERACTION (RPI) - User Configuration
# ============================================================
# Only set the values you need to customize. All internal
# defaults (health probes, security contexts, logging levels,
# service ports, rollout strategies, etc.) are managed by the
# chart via _defaults.tpl.
# ============================================================

# ==========================
# Global Settings
# ==========================
global:
  deployment:
    # Deployment mode: standard | demo
    # standard: production deployment
    # demo: deploys embedded MSSQL + MongoDB containers for local dev/evaluation
    mode: standard
    # Cloud environment: azure, amazon, google, selfhosted
    platform: amazon

    images:
      registry: rg1acrpub.azurecr.io/docker/redpointglobal/releases
      # RPI version: <major.minor>.<year>-<MMDD>-<HHMM>
      tag: "7.8.20260828.906"
      imagePullPolicy: Always
      imagePullSecret:
        enabled: true
        name: redpoint-rpi
      # net-utils image (used by the database-upgrade job). Default
      # {registry}/net-utils:{tag}. Override via overrides or nameOverrides below.
      # Image resolution priority: overrides > nameOverrides > default ({registry}/{service-name}:{tag})
      #
      # overrides: Full URI per service, used verbatim (no registry/tag appended).
      #   Use when images are in different registries or have custom tags.
      # overrides:
      #   rpi-interactionapi: 123456789.dkr.ecr.us-east-1.amazonaws.com/rpi:interactionapi-7.7.20260220.1524
      #   rpi-redis: 123456789.dkr.ecr.us-east-1.amazonaws.com/rpi:rediscache-7.7.20260220.1524
      #
      # nameOverrides: Replaces just the image name, keeps global registry and tag.
      #   Use when images are in the same registry with the same tag but different names.
      #   Result: {registry}/{nameOverride}:{tag}
      # nameOverrides:
      #   rpi-deploymentapi: redpoint-interaction-configuration-editor
      #   rpi-interactionapi: redpoint-interaction-client
    # Optional: set the pod's timezone (e.g., "America/New_York"); leave empty to use default UTC
    podTimezone: "" #

# ==========================
# Global Resource Defaults
# ==========================
# Applied to all services unless overridden per-service.
# Per-service overrides (e.g. interactionapi.resources) take priority.
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 3Gi

# ==========================
# Per-Service Overridable Settings
# ==========================
# These settings are defined in _defaults.tpl and can be overridden per service.
# Example: deploymentapi.enableProbes, executionservice.replicas, etc.
#
# Common per-service settings:
#   enableProbes: true          # Set to false to disable all probes (liveness, readiness, startup)
#   replicas: 1                 # Number of pod replicas
#   enableRPIAuthentication: true
#   enableSwagger: true
#   serviceMesh: true/false     # Per-service Linkerd opt-out
#   cloudIdentity: true/false   # Per-service cloud identity opt-in (per-service mode only)
#   autoscaling:
#     enabled: false
#     type: hpa
#     minReplicas: 2
#     maxReplicas: 5
#   resources:
#     requests: { cpu: 50m, memory: 256Mi }
#     limits: { memory: 3Gi }
#   logging:
#     default: Error
#     database: Error

# ==========================
# Pod Anti-Affinity
# ==========================
# Controls pod anti-affinity for all services.
# Default: soft (preferred) anti-affinity spreading pods across nodes.
# Set type to "required" for hard anti-affinity, or enabled to false to disable.
podAntiAffinity:
  enabled: true
  type: preferred               # preferred | required
  weight: 100                   # weight for preferred (1-100, ignored for required)
  topologyKey: kubernetes.io/hostname

# ==========================
# Custom CA Certificates
# ==========================
# Mount custom CA certificates into all pods.
# Useful when connecting to databases or services using internal/private CAs.
customCACerts:
  enabled: false
  name: ""                      # name of the Kubernetes Secret containing the CA bundle
  mountPath: /usr/local/share/ca-certificates/custom
  # Optional: set SSL_CERT_FILE env var to a specific file in the mount
  # certFile: ""                # e.g., "internal-ca.pem"
  # SDK provider: mount cert directly from vault via CSI inline volume
  # secretProviderClassName: "" # name of the SecretProviderClass to mount

# ==========================
# Common Annotations
# ==========================
# Annotations applied to all resource types: ServiceAccounts, Services, Deployments, and Pods.
# Use this for org-wide annotations (cost center, support email, alert routing, etc.).
commonAnnotations: {}
# commonAnnotations:
#   myorg.com/cost-center: "1234"
#   myorg.com/support-email: "team@example.com"
#   myorg.com/alert-channel: "email,pagerduty"

# Per-resource-type overrides (merged with commonAnnotations)
serviceAccountAnnotations: {}
serviceAnnotations: {}

# ==========================
# Operational Database
# ==========================
databases:
  operational:
    # Supported: sqlserver, postgresql, sqlserveronvm
    provider: sqlserver
    # Cloud SQL for PostgreSQL authenticated via GKE Workload Identity
    # (Application Default Credentials) instead of username/password.
    # Requires provider=postgresql, platform=google, and cloudIdentity
    # enabled; not combinable with cloudSqlProxy.
    googleWorkloadIdentity: false
    server_host: <my-database-server-host>
    server_username: <my-database-server-username>
    server_password: <my-database-server-password>
    pulse_database_name: <my-pulse-database-name>
    pulse_logging_database_name: <my-logging-database-name>
    # Schema the Deployment API uses within the operational database.
    databaseSchema: "dbo"
    encrypt: true

    # Cloud SQL Auth Proxy for the operational database (GKE; PostgreSQL or SQL Server).
    # Requires cloudIdentity.enabled=true. Setup: docs/google-cloud-sql-iam.md.
    cloudSqlProxy:
      enabled: false
      # Required when enabled: "<project>:<region>:<instance>"
      connectionName: ""
      image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.2
      # Local port the proxy listens on. Defaults per engine: 5432 for
      # postgresql, 1433 for sqlserver. Override here if needed.
      # port: 5432
      # Use the Cloud SQL instance's private IP (requires VPC peering between GKE and Cloud SQL).
      privateIp: true
      # Use IAM database authentication instead of password auth. PostgreSQL only;
      # ignored for SQL Server (Cloud SQL for SQL Server has no IAM DB auth via the
      # proxy). When true, connections authenticate as
      # cloudIdentity.google.serviceAccountEmail with no password. The service
      # account must be registered as a Cloud SQL IAM user:
      #   gcloud sql users create <sa-email> --type=cloud_iam_service_account ...
      autoIamAuthn: false
      # Graceful shutdown window; proxy drains connections before exiting.
      terminationGracePeriod: "30s"
      # Authentication mode is auto-detected:
      # - Workload Identity (default): the pod's service account must be bound to
      #   a GCP service account with roles/cloudsql.client. No key file.
      # - Service-account key file: used when cloudIdentity.google.configMapName is
      #   set, reusing the platform-wide Google service account key.
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits:   { cpu: 200m, memory: 256Mi }
      # Extra CLI args appended to the proxy command (e.g., ["--structured-logs", "--debug"]).
      additionalArgs: []

  # ==========================
  # Data Warehouse Providers
  # ==========================
  datawarehouse:

    # BigQuery data warehouse, independent of the deployment platform (Azure,
    # AWS, or Google). Each connection defines its own credentials.
    bigquery:
      enabled: false
      # One entry per BigQuery connection. Choose how each connection
      # authenticates with credentialsType:
      #
      #   serviceAccount  - authenticate with a Google service account key.
      #     Provide serviceAccountEmail and the key file (configMapName,
      #     keyName, ConfigMapFilePath). Choose this when the pods cannot use
      #     Workload Identity, for example when RPI runs on Azure and connects
      #     to BigQuery on Google Cloud.
      #
      #   workloadIdentity - authenticate with Workload Identity, no key file.
      #     Choose this when running on GKE with Workload Identity configured
      #     (set cloudIdentity.google.serviceAccountEmail and leave
      #     cloudIdentity.google.configMapName empty). Omit serviceAccountEmail,
      #     configMapName and keyName on the connection.
      #
      # OAuthMechanism is the BigQuery ODBC driver's authentication mode: use 0
      # for a service account key, and your driver's Application Default
      # Credentials value (typically 3) for Workload Identity.
      connections:
        - name: gbq-tenant1
          projectId: gbq-tenant1
          sqlDialect: 1
          OAuthMechanism: 0
          credentialsType: serviceAccount
          serviceAccountEmail: gbq-tenant1@my-project.iam.gserviceaccount.com
          configMapName: gbq-tenant1
          keyName: gbq-tenant1.json
          ConfigMapFilePath: /app/google-creds
          allowLargeResults: 0
          largeResultsDataSetId: _bqodbc_temp_tables
          largeResultsTempTableExpirationTime: "3600000"
        # Workload Identity (keyless) connection:
        # - name: gbq-tenant1
        #   projectId: gbq-tenant1
        #   sqlDialect: 1
        #   OAuthMechanism: 3
        #   credentialsType: workloadIdentity
        #   allowLargeResults: 0

    # Snowflake
    snowflake:
      enabled: false
      # Supported: snowflake_jwt
      credentialsType: snowflake_jwt
      mountPath: /app/snowflake-creds
      # For csi/sdk: set this to the SecretProviderClass name that mounts
      # the private key(s) via CSI inline volume.
      # secretProviderClassName: ""
      # Key files - one entry per tenant. Each needs its own secretName
      # (the K8s Secret containing the .p8 file) and keyName (the filename).
      # Connection string references: PRIVATE_KEY_FILE=/app/snowflake-creds/<keyName>
      keys:
        - keyName: my-snowflake-rsakey.p8
          secretName: snowflake-rsa-private-key
      # Multi-tenant example:
      # keys:
      #   - keyName: tenant1-private-key.p8
      #     secretName: snowflake-tenant1-key
      #   - keyName: tenant2-private-key.p8
      #     secretName: snowflake-tenant2-key


# ============================================================
# Cloud Identity
# ============================================================
# Pod-to-cloud authentication. Required for sdk and csi secrets modes.
# The authentication mechanism is derived from global.deployment.platform:
#   azure  -> Azure Workload Identity (ServiceAccount annotation + pod label)
#   google -> GCP Workload Identity (ServiceAccount annotation)
#   amazon -> IRSA (ServiceAccount annotation + env vars)
# ============================================================
cloudIdentity:
  enabled: false
  # ServiceAccount mode:
  #   shared      -> one shared SA used by all services (simplest for workload identity)
  #   per-service -> each service creates its own SA (for per-service IAM roles)
  serviceAccount:
    mode: per-service
    name: redpoint-rpi
  # --- Azure Workload Identity ---
  azure:
    managedIdentityClientId: your-workload-identity-client-id
    tenantId: your-azure-tenant-id
  # --- Google Cloud platform identity ---
  # Google platform identity, used only when global.deployment.platform is google.
  # BigQuery data-warehouse credentials are configured separately.
  google:
    serviceAccountEmail: my-google-svs-account@my-project.iam.gserviceaccount.com
    projectId: your_google_project_id
    # Name of the ConfigMap containing a Google service account key file.
    #
    # Leave empty ("") to authenticate to Google Cloud services (Cloud SQL,
    # BigQuery, Pub/Sub, Bigtable) with Workload Identity - no key file
    # required (recommended on GKE).
    # Set this to your ConfigMap name only if your deployment authenticates
    # with a mounted service account key instead of Workload Identity; the
    # default value below keeps that key-file behaviour.
    configMapName: my-google-svs-account
    # Filename of the key inside the ConfigMap. Used only when configMapName is set.
    keyName: my-google-svs-account.json
    # Directory the key file is mounted into. Used only when configMapName is set.
    configMapFilePath: /app/google-creds
  # --- Amazon IRSA / Access Keys ---
  amazon:
    roleArn: arn:aws:iam::my-aws-account-id:role/my-role-name
    region: us-east-1
    # Set to true to inject AWS access keys from the secrets K8s Secret
    # The keys AWS_Access_Key_ID and AWS_Secret_Access_Key must exist in the secret
    useAccessKeys: false

# ============================================================
#  SECRETS MANAGEMENT
# ============================================================
# How secrets are provided to pods:
#   kubernetes -> Chart creates K8s Secret from values (or user pre-creates)
#   sdk        -> App reads directly from cloud vault at runtime (requires cloudIdentity)
#   csi        -> CSI driver syncs cloud vault to K8s Secret (requires cloudIdentity)
# ============================================================
secretsManagement:
  # kubernetes | sdk | csi
  provider: kubernetes
  # --------------------------------------------------------
  # Kubernetes secrets (provider: kubernetes)
  # --------------------------------------------------------
  kubernetes:
    # The chart does NOT create this secret. Create it before deploying using:
    #   rpihelmcli secrets -f overrides.yaml -n <namespace>
    # Then: kubectl apply -f secrets.yaml -n <namespace>
    secretName: redpoint-rpi-secrets
  # --------------------------------------------------------
  # SDK - App reads from cloud vault directly (provider: sdk)
  # --------------------------------------------------------
  sdk:
    # Cloud-vault behavior in SDK mode. Both are overridable on any cloud:
    #   useForAppSettings - read app settings (incl. the database connection)
    #     from the vault. Default true; keep true in SDK mode.
    #   useForConfigPasswords - store RPI config passwords in the vault.
    #     Default true on azure/amazon; false on google (Google Secret Manager
    #     rejects empty secret values, so an unset credential fails
    #     provisioning) - on google they are kept in the operational database.
    azure:
      vaultUri: https://myvault.vault.azure.net/
      configurationReloadIntervalSeconds: 30
      useADTokenForDatabaseConnection: true
    amazon:
      secretTagKey: ""
  # --------------------------------------------------------
  # CSI - CSI driver syncs vault to K8s Secret (provider: csi)
  # Pods consume secrets via secretKeyRef (same as kubernetes mode)
  # --------------------------------------------------------
  csi:
    # The K8s secret name created by the CSI driver
    secretName: redpoint-rpi-secrets
    # How the CSI sync is triggered. Options:
    #   none          - use dedicated validation pods (default)
    #   deploymentapi - mount CSI volume on the Deployment API pod to trigger sync
    # When set to deploymentapi, the Deployment API pod mounts the CSI volume on
    # startup, which triggers the CSI driver to sync secrets from the vault into
    # the K8s Secret. No validation pods needed. All other service pods read from
    # the K8s Secret as usual.
    syncService: none
    # SecretProviderClass definitions
    secretProviderClasses:
    # ----------------------------------------------------
    # Example: TLS Certificate from Azure Key Vault
    # ----------------------------------------------------
    - name: my-secret-class-1
      provider: azure
      secretObjects:
        - secretName: secret1
          type: kubernetes.io/tls
          data:
            - key: tls.key
              objectName: my-tls-certificate
      parameters:
        keyvaultName: my-keyvault-name
        resourceGroup: my-resource-group
        subscriptionId: my-subscription-id
        clientID: my-managed-identity-client-id
        tenantId: my-azure-tenant-id
        usePodIdentity: "false"
        useVMManagedIdentity: "false"
        useWorkloadIdentity: "true"
      objects:
        - objectName: "my-tls-certificate"
          objectType: secret
    # ----------------------------------------------------
    # Example: Database Connection String
    # ----------------------------------------------------
    - name: my-secret-class-2
      provider: azure
      secretObjects:
        - secretName: secret2
          type: Opaque
          data:
            - key: ConnectionString_Logging_Database
              objectName: V7-ConnectionString-LoggingDatabase
      parameters:
        keyvaultName: my-keyvault-name
        resourceGroup: my-resource-group
        subscriptionId: my-subscription-id
        clientID: my-managed-identity-client-id
        tenantId: my-azure-tenant-id
        usePodIdentity: "false"
        useVMManagedIdentity: "false"
        useWorkloadIdentity: "true"
        syncSecret: "true"
        enable-secret-rotation: "true"
      objects:
        - objectName: "V7-ConnectionString-Operations"
          objectType: secret
    # ----------------------------------------------------
    # Example: AWS Secrets Manager with jmesPath extraction
    # ----------------------------------------------------
    # - name: redpoint-secret-class
    #   provider: aws
    #   objectsContent: |
    #     - objectName: "arn:aws:secretsmanager:us-east-1:123456789:secret/rpi-db-creds"
    #       objectType: secretsmanager
    #       jmesPath:
    #         - path: username
    #           objectAlias: db_username
    #         - path: password
    #           objectAlias: db_password
    #   secretObjects:
    #     - secretName: redpoint-rpi-secrets
    #       type: Opaque
    #       data:
    #         - key: db_username
    #           objectName: db_username
    #         - key: db_password
    #           objectName: db_password

# ==========================
# Storage
# ==========================
# Two provisioning modes:
#   Static:  Define PVs + PVCs under persistentVolumes[]. You control volume handles.
#   Dynamic: Define only PVCs + a StorageClass with provisioner parameters.
#            The CSI driver auto-provisions volumes. No persistentVolumes[] needed.
# See docs/storage.md for examples of both modes.
storage:
  # StorageClass (required for dynamic, optional for static)
  storageClass:
    enabled: false
    name: redpoint-rpi
    provisioner: ""             # e.g., efs.csi.aws.com
    reclaimPolicy: Delete       # Delete | Retain
    volumeBindingMode: Immediate
    mountOptions: []
    # mountOptions:
    #   - iam
    parameters: {}
    # Example: AWS EFS
    # parameters:
    #   provisioningMode: efs-ap
    #   fileSystemId: fs-0123456789abcdef0
    #   directoryPerms: "755"
    #   uid: "7777"
    #   gid: "7777"
    #   basePath: /rpi
    #   subPathPattern: shared-data
    #   ensureUniqueDirectory: "false"
    #   reuseAccessPoint: "true"

  persistentVolumeClaims:
    FileOutputDirectory:
      enabled: false
      claimName: rpifileoutputdir
      mountPath: /rpifileoutputdir
    Plugins:
      enabled: false
      claimName: realtimeplugins
      mountPath: /app/plugins
    DataManagementUploadDirectory:
      enabled: false
      claimName: rpdmuploaddirectory
      mountPath: /rpdmuploaddirectory

  # Dynamic PVCs (no PV needed - the CSI driver auto-provisions storage)
  # Use with a StorageClass that supports dynamic provisioning (e.g., EFS with efs-ap mode).
  dynamicPVCs: []
  # dynamicPVCs:
  #   - claimName: rpi-claim
  #     storageClassName: redpoint-rpi
  #     accessModes: [ReadWriteMany]
  #     storage: 5Gi

  # Create PV + PVC pairs (for CSI-backed storage with static provisioning)
  persistentVolumes: []
  # persistentVolumes:
  #   - name: rpi-blob-storage
  #     capacity: 100Gi
  #     accessModes: [ReadWriteMany]
  #     storageClassName: blob-fuse
  #     reclaimPolicy: Retain
  #     mountOptions:
  #       - -o allow_other
  #       - --file-cache-timeout-in-seconds=120
  #     csi:
  #       driver: blob.csi.azure.com
  #       volumeHandle: unique-volume-handle
  #       volumeAttributes:
  #         containerName: rpi-data
  #         storageAccount: mystorageaccount
  #     pvc:
  #       claimName: rpi-blob-pvc

# ==========================
# Realtime API
# ==========================
realtimeapi:
  enabled: true
  replicas: 1
  rpiClientID: 00000000-0000-0000-0000-000000000000
  # Per-client Realtime API address overrides (multitenant only; requires
  # realtimeapi.multitenant=true). Each entry routes one client (tenant) to a
  # specific Realtime API base address; clients not listed use the
  # cluster-wide address.
  clientAddressOverrides: []
  # clientAddressOverrides:
  #   - clientId: 00000000-0000-0000-0000-000000000000
  #     address: https://realtime-eu.example.com
  authentication:
    # Supported: basic, oauth
    type: basic
    basic:
      standard: false
      forms: true
      listenerQueue: true
      recommendations: true
    oauth:
      accessTokenLifetimeSeconds: 360
      refreshTokenLifetimeSeconds: 360
  CORSOrigins: ["*"]
  # Realtime server visitor cookie (defaults shown; uncomment to override).
  # RealtimeServerCookieDomain is optional: unset leaves the cookie host-only.
  # RealtimeServerCookieEnabled: false
  # RealtimeServerCookieName: rg-visitor
  # RealtimeServerCookieExpires: 60
  # RealtimeServerCookieHttpOnly: false
  # RealtimeServerCookieDomain: ".example.com"

  # Geolocation settings for real-time weather / location enrichment.
  # Disabled by default. When enabled, the settings below are applied AND the
  # provider APIKey becomes required: supply it via the shared RPI Secret key
  # `RealtimeAPI_Geolocation_APIKey` (kubernetes/csi) or the cloud vault (sdk).
  # Enabling the feature without that key makes the Realtime API pod fail fast
  # (by design). To use your own provider instead of native Azure, author a
  # plugin and set pluginAssembly / pluginType / pluginSettings (and the ipLookup
  # equivalents).
  geolocation:
    enabled: false
    # Supported: Azure (native), or a custom provider via the plugin fields below
    provider: Azure
    # Supported: imperial, metric
    weatherUnits: imperial
    coordsCacheTimespanMinutes: 10
    # Custom geolocation provider plugin (leave blank to use the native provider)
    pluginAssembly: ""
    pluginType: ""
    # Plugin settings as a list of key/value pairs, e.g.:
    #   pluginSettings:
    #     - key: Endpoint
    #       value: "https://..."
    pluginSettings: []
    # Optional IP-address-based geolocation lookup
    ipLookup:
      enableGeoIPLookup: false
      coordsCacheTimespanMinutesIPLookup: 30
      pluginAssembly: ""
      pluginType: ""
      pluginSettings: []

  # Identity settings: how a known visitor's profile is keyed once they identify
  # themselves (via querystring, a cached attribute list, or a Realtime cache offer).
  identitySettings:
    # Principal key used to identify a known visitor's profile. e.g. with
    # masterKeyName "CustomerKey", ?CustomerKey=12345 keys the profile on
    # CustomerKey=12345. Blank leaves the visitor keyed on the RPI-assigned GUID.
    masterKeyName: ""
    # Alternative names the master key may appear under (e.g. "CK" for "CustomerKey").
    masterKeyAliases: []
    # Additional keys that can also identify a visitor. Linked to the master key
    # via a querystring carrying both, or a populated Realtime cache.
    alternativeKeys: []
    # Merge querystring parameters / cached-attribute-list attributes into the profile.
    mergeParameters: true
    mergeCALAttributes: true
    # Parameter / CAL attribute names to exclude from the merge, e.g.:
    #   parameterMergeExclusions:
    #     - utm_source
    parameterMergeExclusions: []
    calMergeExclusions: []

  # Real-Time Cache Provider
  cacheProvider:
    enabled: true
    # Supported: mongodb, azureredis, redis, inMemorySql, googlebigtable
    # Empty resolves to the platform default: google -> googlebigtable,
    # azure/amazon/selfhosted -> mongodb.
    provider: ""
    mongodb:
      databaseName: <my-realtime-cache-db>
      collectionName: <my-realtime-cache-collection>
      # Authentication mechanism for MongoDB Atlas.
      #   default  - username/password in the connection string
      #   iamRole  - AWS IAM via MONGODB-AWS (passwordless auth on Amazon EKS)
      #             Requires roleArn below. The chart adds the eks.amazonaws.com/role-arn
      #             annotation to the Realtime API's ServiceAccount and injects AWS env vars
      #             (AWS_STS_REGIONAL_ENDPOINTS, AWS_DEFAULT_REGION) into the pod.
      #             The EKS Pod Identity Agent injects container credentials automatically.
      #             The MongoDB driver authenticates using the pod's IAM role.
      #             Prerequisites:
      #               1. Add the IAM role ARN as a database user in Atlas (Database Access → AWS IAM)
      #               2. The IAM role needs a trust policy for your EKS cluster's OIDC provider
      authMechanism: default
      # IAM role ARN for MONGODB-AWS authentication (only used when authMechanism: iamRole)
      roleArn: ""
      # AWS region for STS endpoint (only used when authMechanism: iamRole)
      region: us-east-1
    redis:
      # internal: chart-managed Redis | external: BYO Redis
      type: internal
    googlebigtable:
      projectId: <my-bigtable-project-id>
      instanceId: <my-bigtable-instance-id>

  # Real-Time Queue Provider
  queueProvider:
    enabled: true
    # Supported: amazonsqs, azureservicebus, googlepubsub, azureeventhubs, rabbitmq, azurestorage, amazonmsk
    # Empty resolves to the platform default: azure -> azureservicebus,
    # amazon -> amazonsqs, google -> googlepubsub, selfhosted -> rabbitmq.
    provider: ""
    queueNames:
      formQueuePath: RPIWebFormSubmission
      eventsQueuePath: RPIWebEvents
      cacheOutputQueuePath: RPIWebCacheData
      recommendationsQueuePath: RPIWebRecommendations
      listenerQueuePath: RPIQueueListener
      callbackServiceQueuePath: RPICallbackApiQueue
    amazonsqs:
      # Supported: accessKey (configure keys under cloudIdentity.amazonSettings)
      credentialsType: accessKey
    azurestorage:
      storageAccountName: myStorageAccountName
      useAzureIdentityAuthentication: false
    googlepubsub:
      projectId: <my-google-project-id>
    azureeventhubs:
      eventHubName: RPIQueueListener
      NamespaceName: my_eventhub_namespace_name
      PartitionIds:
        - "0"
    rabbitmq:
      # internal: chart-managed RabbitMQ | external: BYO RabbitMQ
      # rabbitmqSettings.username defaults to the release namespace; set to override.
      type: internal
    amazonmsk:
      bootstrapServers: <my-server1.c2.kafka.us-east-1.amazonaws.com:9198>

  # Custom Realtime plugins (see docs/plugins.md for examples)
  customPlugins:
    enabled: false
    # list: []

  autoscaling:
    enabled: false

  # RedPoint ML scoring integration. Leave blank to keep it disabled.
  RedPointMLServiceAddress: ""
  RedPointMLClientID: ""
  # Visitor profile merge behaviour.
  EnableProfileMergeEvents: true
  TrackProfileMergeInSourceProfile: true
  # File output written by the service. Directory comes from the
  # FileOutputDirectory persistent volume claim when enabled.
  fileOutput:
    allowClientOverrides: true
    allowAllServerLocations: true
  # Realtime agent runtime.
  agentConfig:
    traceLogEnabled: false
    cachedSelectionRuleExpiry: 120
  # Passthrough lists, empty by default. See docs/values_reference.yaml for the
  # object shape of each: CacheOutputExclusions, parameterToDataMappings,
  # visitorViews, queueListenerConfiguration.

# ==========================
# Callback API
# ==========================
callbackapi:
  enabled: true
  replicas: 1
  channelLabel: SendGrid
  # Enable multitenancy for per-client instances
  multitenancy:
    enabled: false
  instances:
    - name: "tenant1"
      replicas: 1
  #  - name: "client2"
  #    replicas: 1
  autoscaling:
    enabled: false

# ==========================
# Execution Service
# ==========================
executionservice:
  enabled: true
  replicas: 1
  enableRPIAuthentication: true
  # Internal cache for execution state
  internalCache:
    enabled: true
    # Supported: filesystem, azureblob
    provider: filesystem
    # Azure Blob settings (when provider=azureblob)
    azureStorageSettings:
      accountName: my_storage_account_name
      containerName: rpi
      connectionString: DefaultEndpointsProtocol=https;AccountName=<myAccoutName;AccountKey=<myAccountAccessKey;EndpointSuffix=core.windows.net
      useCloudIdentity: false
  # Optional external integrations. Disabled by default; enable and populate
  # the paired Secret key (see secrets-management.md) to activate.
  # Internal RabbitMQ broker. Password: shared Secret key QueueService_RabbitMQ_Password
  internalQueues:
    enabled: false
    hostName: localhost
    virtualHost: "/"
    username: redpointrpi
    port: 5672
    isDurable: true
  # Azure Web PubSub. ConnectionString: shared Secret key PubSub_ConnectionString
  pubSub:
    enabled: false
    provider: Azure
    azureSettings:
      endpoint: ""
  # Mercury integration. Password: shared Secret key Mercury_Password
  mercury:
    enabled: false
    address: ""
    username: ""
  logging:
    # New Relic log forwarding. ApiKey: shared Secret key NewRelic_ApiKey
    newRelic:
      enabled: false
    # Loggly log forwarding. ApiKey: shared Secret key Loggly_ApiKey
    loggly:
      enabled: false
  autoscaling:
    enabled: false
    # Supported: hpa, keda (KEDA is recommended for execution service)
    # type: hpa

# ==========================
# Interaction API
# ==========================
interactionapi:
  enabled: true
  replicas: 1
  enableRPIAuthentication: true
  # Native-auth password policy, enforced when users are created or change
  # their password. The Interaction API is the identity provider; the policy
  # also applies on the Integration API (both share one user store).
  passwordPolicy:
    requiredLength: 6
    requiredUniqueChars: 1
    requireDigit: true
    requireNonAlphanumeric: true
    requireLowercase: true
    requireUppercase: true
  # Account lockout after repeated failed sign-in attempts. Optional: when a
  # key is unset the application default applies. lockoutTimeSpan is a .NET
  # TimeSpan, e.g. "00:05:00" for five minutes.
  accountLockout: {}
    # maxFailedAccessAttempts: 5
    # lockoutTimeSpan: "00:05:00"
  # Native-auth token lifetimes (seconds)
  accessTokenLifetimeSeconds: 3600
  refreshTokenLifetimeSeconds: 36000
  # RPI Client map control. ApplicationId: shared Secret key MapControl_ApplicationId
  mapControl:
    enabled: false
    provider: Bing
  # RPI Client weather lookup. APIKey: shared Secret key Weather_ApiKey
  weatherApi:
    enabled: false
    address: "https://dataservice.accuweather.com"
  # Optional external integrations. Disabled by default; enable and populate
  # the paired Secret key (see secrets-management.md) to activate.
  # Azure Web PubSub. ConnectionString: shared Secret key PubSub_ConnectionString
  pubSub:
    enabled: false
    provider: Azure
    azureSettings:
      endpoint: ""
  # Mercury integration. Password: shared Secret key Mercury_Password
  mercury:
    enabled: false
    address: ""
    username: ""
  logging:
    # New Relic log forwarding. ApiKey: shared Secret key NewRelic_ApiKey
    newRelic:
      enabled: false
    # Loggly log forwarding. ApiKey: shared Secret key Loggly_ApiKey
    loggly:
      enabled: false
  autoscaling:
    enabled: false

# ==========================
# Integration API
# ==========================
integrationapi:
  enabled: true
  replicas: 1
  enableRPIAuthentication: true
  # Credentials (required if Smart Activation is enabled)
  username: admin@noemail.com
  password: my_Super_Strong_Pwd
  autoscaling:
    enabled: false

# ==========================
# Node Manager
# ==========================
nodemanager:
  enabled: true
  replicas: 1
  enableRPIAuthentication: true
  # Optional external integrations. Disabled by default; enable and populate
  # the paired Secret key (see secrets-management.md) to activate.
  # Azure Web PubSub. ConnectionString: shared Secret key PubSub_ConnectionString
  pubSub:
    enabled: false
    provider: Azure
    azureSettings:
      endpoint: ""
  # Mercury integration. Password: shared Secret key Mercury_Password
  mercury:
    enabled: false
    address: ""
    username: ""
  logging:
    # New Relic log forwarding. ApiKey: shared Secret key NewRelic_ApiKey
    newRelic:
      enabled: false
    # Loggly log forwarding. ApiKey: shared Secret key Loggly_ApiKey
    loggly:
      enabled: false
  autoscaling:
    enabled: false

# ==========================
# Deployment API
# ==========================
deploymentapi:
  enabled: true
  replicas: 1
  # OIDC authentication for the Deployment API endpoints. Disabled by default.
  # When enabled, all four values below are required (the render fails if any
  # is missing); there are no defaults.
  authentication:
    enabled: false
    # issuer: https://login.example.com/realms/rpi
    # hostAddress: https://deployment.example.com
    # audience: rpi-deploymentapi
    # clientId: rpi-deploymentapi
  # Use exported tenant template files for new tenant creation
  templateTenant:
    useTemplateFiles: false
    templateTenantFilesPath: "/tmp/templatetenantfiles"
    volumeClaimName: templatetenantfiles

# ==========================
# Queue Reader
# ==========================
queuereader:
  enabled: true
  replicas: 1
  realtimeConfiguration:
    # Enable distributed processing for high-volume transactions
    isDistributed: false
    # RPI client IDs for this cluster
    # tenantIds:
    #   - <client-guid>
  # Internal queue for distributed processing
  internalQueues:
    rabbitmqSettings:
      # username defaults to the release namespace; set to override.
      username: ""
  errorQueuePath: listenerQueueError
  nonActiveQueuePath: listenerQueueNonActive
  # Optional external integrations. Disabled by default; enable and populate
  # the paired Secret key (see secrets-management.md) to activate.
  # Azure Web PubSub. ConnectionString: shared Secret key PubSub_ConnectionString
  pubSub:
    enabled: false
    provider: Azure
    azureSettings:
      endpoint: ""
  logging:
    # New Relic log forwarding. ApiKey: shared Secret key NewRelic_ApiKey
    newRelic:
      enabled: false
    # Loggly log forwarding. ApiKey: shared Secret key Loggly_ApiKey
    loggly:
      enabled: false
  autoscaling:
    enabled: false

# ==========================
# Rebrandly (URL Shortener)
# ==========================
rebrandly:
  enabled: false
  apiKey: my_rebrandly_api_key
  redisSettings:
    # internal: chart-managed Redis | external: BYO Redis. For external, populate
    # the shared Secret key Rebrandly_Redis_Password (sdk mode resolves it from
    # the vault); useAzureCredentials=true uses Azure identity instead.
    type: internal
    # External Redis endpoint (if type=external)
    hostname: rpi-rebrandly-cache
    useAzureCredentials: false
    port: 6379

diagnosticsMode:
  copytoAzureBlob:
    enabled: false
    accountName: <yourstorageaccount>
    accessKey: <yourstorageaccount-access-key>
    containerName: <yourstorageaccount-container-name>
    blobServiceEndpoint: https://yourstorage.blob.core.windows.net
    enableCdn: false
    UseDataLakeStorageGen2: false
    # Use the pod's managed identity instead of the access key
    useAzureIdentityAuthentication: false
  copytoSftp:
    enabled: false
    sftpHost: <your-sftp-host>
    sftpUsername: <your-sftp-username>
    sftpPassword: <your-sftp-password>
    sftpPort: "22"
    # Transfer diagnostics over SFTP rather than plain FTP
    useSftp: true

# ==========================
# Microsoft Entra ID Authentication
# ==========================
MicrosoftEntraID:
  enabled: false
  interaction_client_id: 00000000-0000-0000-0000-000000000000
  interaction_api_id: 00000000-0000-0000-0000-000000000000
  tenant_id: 00000000-0000-0000-0000-000000000000

# ==========================
# OpenID Connect Providers
# ==========================
OpenIdProviders:
  enabled: false
  # Supported: keycloak, Okta
  name: Keycloak
  authorizationHost: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0
  clientID: 00000000-0000-0000-0000-000000000000
  audience: api://00000000-0000-0000-0000-000000000000
  redirectURL: https://rpi-interactionapi.example.com
  enableRefreshTokens: true
  validateIssuer: false
  validateAudience: true
  logoutIdTokenParameter: id_token_hint
  # customScopes:
  #   - api://00000000-0000-0000-0000-000000000000/Interaction.Clients
  supportsUserManagement: false

# ==========================
# SMTP Settings
# ==========================
SMTPSettings:
  SMTP_SenderAddress: noreply-rpi@example.com
  SMTP_SenderName: "Redpoint Global"
  SMTP_Address: your_smtp_host
  SMTP_Port: 587
  EnableSSL: true
  UseCredentials: true
  SMTP_Username: your_smtp_server_username
  # SMTP_Password is stored in the K8s Secret, not here.
  # See Required Secret Keys in secrets-management.md: SMTP_Password

# ============================================================
#  INGRESS
# ============================================================

ingress:
  controller:
    enabled: false
  mode: public                            # public | private
  certificateSource: kubernetes           # kubernetes | acm
  # TLS entries (rendered when certificateSource=kubernetes)
  # Add entries with explicit hosts lists for multi-cert setups
  tls:
    - secretName: ingress-tls
    # - secretName: certsecrets             # additional cert for FQDN hosts
    #   hosts:
    #     - mpulse.example.com
  domain: example.com
  subnetName: <my-ingress-vpc-subnet-name>  # required if mode=private
  certificateArn: your_acm_certificate_arn  # required if certificateSource=acm
  privateLink:
    azure:
      enabled: false
  # Service hostnames - subdomains are prepended to domain,
  # values containing a dot are used as FQDNs (e.g., mpulse.example.com)
  hosts:
    config: rpi-deploymentapi
    client: rpi-interactionapi
    integration: rpi-integrationapi
    realtime: rpi-realtimeapi
    callbackapi: rpi-callbackapi            # or: mpulse.example.com (FQDN)
    queuereader: rpi-queuereader
    rabbitmqconsole: rpi-rabbitmq-console
    smartactivation: rpi-smartActivation

# ==========================
# Network Policy
# ==========================
networkPolicy:
  enabled: false

# ==========================
# Service Mesh
# ==========================
serviceMesh:
  enabled: false
  # Supported: linkerd
  provider: linkerd
  # Pod annotations added to all RPI deployments when service mesh is enabled.
  # Defaults: inject=enabled, skip-outbound-ports=443, proxy-outbound-connect-timeout=240000ms
  # Override or add annotations here; these merge with (and override) the defaults.
  # To disable injection for a specific service, set podAnnotations on that service:
  #   deploymentapi:
  #     podAnnotations:
  #       linkerd.io/inject: disabled
  podAnnotations: {}
  # podAnnotations:
  #   linkerd.io/inject: enabled
  #   config.linkerd.io/skip-outbound-ports: "443,587"
  #   config.linkerd.io/proxy-outbound-connect-timeout: "300000ms"
  #   config.linkerd.io/proxy-cpu-request: "100m"
  # Shared defaults for all servers. Per-server values override these.
  serverDefaults: {}
  # serverDefaults:
  #   port: 8080
  #   proxyProtocol: HTTP/1
  #   allowUnauthenticated: true
  #   networks:
  #     - cidr: 10.0.0.0/8
  #
  # L7 traffic policy per service.
  # podSelector is auto-derived from the name if not set (e.g., name "aks-rpi-realtimeapi"
  # produces podSelector app.kubernetes.io/name: rpi-realtimeapi).
  # Per-server values override serverDefaults.
  servers: []
  # Minimal example (using serverDefaults for shared settings):
  # servers:
  #   - name: aks-rpi-interactionapi
  #   - name: aks-rpi-executionservice
  #     allowUnauthenticated: false
  #   - name: aks-rpi-nodemanager
  #     allowUnauthenticated: false
  #   - name: aks-rpi-realtimeapi
  #   - name: aks-rpi-callbackapi
  #   - name: aks-rpi-integrationapi
  #   - name: aks-rpi-deploymentapi
  #   - name: aks-rpi-queuereader
  #
  # Full example (explicit per-server settings):
  # servers:
  #   - name: aks-rpi-realtimeapi
  #     podSelector:
  #       app.kubernetes.io/name: rpi-realtimeapi
  #     port: 8080
  #     proxyProtocol: HTTP/1
  #     allowUnauthenticated: true
  #     networks:
  #       - cidr: 10.0.0.0/8

# ==========================
# Node Scheduling
# ==========================
nodeSelector:
  enabled: false
  key: app
  value: redpoint-rpi

tolerations:
  enabled: false
  effect: NoSchedule
  key: app
  operator: Equal
  value: redpoint-rpi

# ==========================
# Node Provisioning
# ==========================
# Optional: create a Karpenter NodePool for dedicated RPI nodes.
# Useful on EKS when you want RPI pods on specific instance types with taints.
nodeProvisioning:
  enabled: false
  provider: karpenter           # karpenter
  karpenter:
    nodePool:
      name: redpoint-nodepool
      labels: {}
      # labels:
      #   workload: redpoint-api
      taints: []
      # taints:
      #   - key: workload
      #     value: redpoint-api
      #     effect: NoSchedule
      startupTaints: []
      # startupTaints:
      #   - key: efs.csi.aws.com/agent-not-ready
      #     value: "true"
      #     effect: NoSchedule
      requirements: []
      # requirements:
      #   - key: karpenter.k8s.aws/instance-family
      #     operator: In
      #     values: ["m7i"]
      #   - key: karpenter.k8s.aws/instance-size
      #     operator: In
      #     values: ["4xlarge"]
      #   - key: kubernetes.io/arch
      #     operator: In
      #     values: ["amd64"]
      #   - key: karpenter.sh/capacity-type
      #     operator: In
      #     values: ["on-demand"]
      expireAfter: 360h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      disruption:
        consolidationPolicy: WhenEmpty
        consolidateAfter: 15m
      limits:
        cpu: "1000"
        memory: 1000Gi
      weight: 10

# ==========================
# Redpoint AI
# ==========================
redpointAI:
  enabled: false
  # Sensitive values (ApiKey, SearchKey, ConnectionString) are stored in the K8s Secret,
  # not here. See Required Secret Keys in secrets-management.md:
  #   RPI_NLP_API_KEY, RPI_NLP_SEARCH_KEY, RPI_NLP_MODEL_CONNECTION_STRING
  naturalLanguage:
    ApiBase: https://example.openai.azure.com/
    ApiVersion: 2023-07-01-preview
    ChatGptEngine: gpt-5.2
    ChatGptTemp: 0.5
  cognitiveSearch:
    # RPI creates and uses the vector-search profile + config dynamically
    # when it generates the index (SQL Database Definition > Update AI
    # Model); no client-facing setting is required for them.
    SearchEndpoint: https://example.search.windows.net
  modelStorage:
    EmbeddingsModel: text-embedding-ada-002
    ModelDimensions: 1536
    ContainerName: my_blob_container_name
    BlobFolder: my_blob_container_folder_name
  logging:
    # Verbose NLP request/response tracing for diagnostics. Off by default.
    enableTrace: false

# ==========================
# Smart Activation
# ==========================
smartActivation:
  enabled: false
  secretName: rpi-smartactivation

# Auth Service (Smart Activation)
authservice:
  replicas: 1
  default_username: admin@noemail.com
  default_password: my_Super_Strong_Pwd

# Keycloak (Smart Activation)
keycloak:
  replicas: 1
  hostname: keycloak
  username: admin@noemail.com
  password: my_Super_Strong_Pwd
  database_name: keycloak
  realm_name: redpoint-mercury
  realm_client_id: rpi-service
  realm_client_secret: <my-realm-client-secret>

# Reporting Service
reportingservice:
  sigma:
    enabled: false
    api_url: https://api.us.azure.sigmacomputing.com
    client_id: 48dd1982ab835ff53177e9cbd7fb5608b1db8c56491a040f2f0843a3bfc6b440
    client_secret: my_sigma_client_secret

# Init Service (Smart Activation)
initservice:
  replicas: 1
  database:
    operational:
      name: smart_activation_db
      connection_string: mongodb+srv://<my_username>:<my_password>@<my_hostname>/?retryWrites=true&w=majority

# Message Queue (Smart Activation)
messageq:
  replicas: 1
  username: redpointrpi

# Maintenance Service (Smart Activation)
maintenanceservice:
  replicas: 1

# Services API (Smart Activation)
servicesapi:
  replicas: 1
  sso_enabled: true

# Socket.io (Smart Activation)
socketio:
  replicas: 1

# UI Service (Smart Activation)
uiservice:
  replicas: 1

# CDP Cache (Smart Activation)
cdpcache:
  enabled: true
  replicas: 1

# ==========================
# Custom Labels and Annotations
# ==========================
# customLabels:
#   environment: "prod"
#   team: "marketing"
customLabels: {}

# Pod-only labels (applied to pod template only, not Deployment metadata).
# Use this for labels that should only be on pods, e.g., workload identity.
# podLabels:
#   azure.workload.identity/use: "true"
podLabels: {}

# customAnnotations:
#   my-custom-annotation: "my-value"
customAnnotations: {}

# ==========================
# Custom Metrics
# ==========================
# Enable Prometheus scrape annotations on all RPI service pods.
# When enabled, RPI service pods advertise Prometheus scrape annotations so an
# external Prometheus can discover and scrape them.
customMetrics:
  enabled: false
