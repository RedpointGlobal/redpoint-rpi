{{- $cfg := .Values.rpiMcpServer | default dict -}}
{{- if $cfg.enabled -}}

{{- $name := "rpi-mcpserver" -}}
{{- $ingCfg := fromYaml (include "rpi.merged.ingress" .) -}}
{{- $service := $cfg.service | default dict -}}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "mcpserver") | nindent 4 }}
  annotations:
    {{- include "rpi.ingress.annotations" . | nindent 4 }}
    # Streamable HTTP holds the response open for the life of an MCP call.
    # nginx buffers responses by default, which stalls the stream until the
    # call completes, so buffering is off on this route only.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: {{ $ingCfg.className }}
  {{- if eq $ingCfg.certificateSource "kubernetes" }}
  tls:
  {{- range $ingCfg.tls }}
  - secretName: {{ .secretName }}
    {{- if .hosts }}
    hosts:
    {{- range .hosts }}
      - {{ . }}
    {{- end }}
    {{- end }}
  {{- end }}
  {{- end }}
  rules:
    - host: {{ include "rpi.ingress.fqdn" (dict "host" $ingCfg.hosts.rpimcpserver "domain" $ingCfg.domain) }}
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ $name }}
              port:
                number: {{ $service.port | default 3002 }}
{{- end }}
