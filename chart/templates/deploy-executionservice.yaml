        {{- if not (eq .Values.secretsManagement.provider "sdk") }}
        - name: ConfigurationStore__ConnectionString
          valueFrom:
            secretKeyRef:
              name: {{ include "rpi.secrets.secretName" . | quote }}
              key: ConfigurationStore_ConnectionString
        {{- end }}
        {{- end }}
        {{- if $cfg.logging.newRelic.enabled }}
        - name: Logging__NewRelic__Enabled
          value: "true"
        - name: Logging__NewRelic__HttpsEndpoint
          value: {{ $cfg.logging.newRelic.httpsEndpoint | quote }}
        - name: Logging__NewRelic__LogLevel__Default
          value: {{ $cfg.logging.newRelic.logLevelDefault | quote }}
        - name: Logging__NewRelic__RPITrace
          value: {{ $cfg.logging.newRelic.rpiTrace | quote }}
        - name: Logging__NewRelic__RPIError
          value: {{ $cfg.logging.newRelic.rpiError | quote }}
        {{- if not (eq .Values.secretsManagement.provider "sdk") }}
