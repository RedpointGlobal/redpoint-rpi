{{- $ai := .Values.redpointAI | default dict -}}
{{- $rtUser := $ai.agentRuntime | default dict -}}
{{- if $rtUser.enabled -}}

{{- $name := "rpi-aiserver" -}}
{{- $rt := mustMergeOverwrite (fromYaml (include "rpi.defaults.rpiaiserver" .)) $rtUser -}}
{{- $model := $ai.model | default dict -}}
{{- $mcp := $ai.mcp | default dict -}}
{{- $storage := $rt.storage | default dict -}}
{{- $intCfg := fromYaml (include "rpi.merged.service" (dict "root" . "name" "integrationapi")) -}}

{{- if not $mcp.enabled -}}
{{- fail "redpointAI.agentRuntime.enabled=true requires redpointAI.mcp.enabled=true. The runtime has no tool surface without it, and inherits redpointAI.mcp.defaultClientId." -}}
{{- end -}}

{{- if eq .Values.secretsManagement.provider "sdk" -}}
{{- fail "redpointAI.agentRuntime.enabled=true requires secretsManagement.provider 'kubernetes' or 'csi'. The runtime resolves its credentials from environment bindings and cannot read a cloud vault." -}}
{{- end -}}

{{- if ne (int $rt.replicaCount) 1 -}}
{{- fail "redpointAI.agentRuntime.replicaCount must be 1. The runtime owns a SQLite database on a single volume." -}}
{{- end -}}

{{- /* The resource name is the first label of the endpoint host. */ -}}
{{- $apiHost := $model.ApiBase | default "" | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" -}}
{{- $derived := "" -}}
{{- if contains "." $apiHost }}{{- $derived = (splitList "." $apiHost | first) -}}{{- end -}}
{{- $resourceName := $rt.azureResourceName | default $derived -}}
{{- if not $resourceName -}}
{{- fail "redpointAI.agentRuntime could not derive the Azure OpenAI resource name from redpointAI.model.ApiBase. Set redpointAI.agentRuntime.azureResourceName explicitly when the endpoint is not https://<resource>.openai.azure.com." -}}
{{- end -}}

{{- /* Self hosted falls through to the cluster's default class. */ -}}
{{- $storageClass := "" -}}
{{- if eq .Values.global.deployment.platform "azure" }}{{- $storageClass = "managed-csi" -}}
{{- else if eq .Values.global.deployment.platform "amazon" }}{{- $storageClass = "gp3" -}}
{{- else if eq .Values.global.deployment.platform "google" }}{{- $storageClass = "standard-rwo" -}}
{{- end -}}

{{- include "rpi.block.serviceAccount" (dict "root" . "name" $name "component" "agentruntime" "cfg" (dict "enabled" true "serviceAccount" ($rt.serviceAccount | default (dict "enabled" true)))) }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "agentruntime") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with $storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $storage.size | default "50Gi" | quote }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "agentruntime") | nindent 4 }}
spec:
  ports:
  - name: http
    port: 3000
    protocol: TCP
    targetPort: api
  selector:
    app.kubernetes.io/name: {{ $name }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "agentruntime") | nindent 4 }}
    app.kubernetes.io/version: {{ .Values.global.deployment.images.tag | quote }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "agentruntime") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "rpi.serviceAccountName" (dict "root" . "name" $name "cfg" (dict "serviceAccount" ($rt.serviceAccount | default (dict "enabled" true)))) }}
      {{- if .Values.global.deployment.images.imagePullSecret.enabled }}
      imagePullSecrets:
        - name: {{ .Values.global.deployment.images.imagePullSecret.name }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
      - name: {{ $name }}
        image: {{ include "rpi.image" (dict "root" . "name" $name) }}
        imagePullPolicy: {{ .Values.global.deployment.images.imagePullPolicy | default "IfNotPresent" }}
        ports:
        - name: api
          containerPort: 3000
          protocol: TCP
        env:
        - name: PORT
          value: "3000"
        # Setting DATABASE_URL instead selects PostgreSQL.
        - name: DB_FILE_NAME
          value: /app/data/redpoint-ai.db
        - name: AUTH_REQUIRED
          value: "true"
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "rpi.secrets.internalSecretName" . | quote }}
              key: RPI_AI_Auth_Secret
        # Inherited from redpointAI. Search index, blob storage and
        # temperature belong to nlp.
        - name: AZURE_OPENAI_RESOURCE_NAME
          value: {{ $resourceName | quote }}
        - name: AZURE_OPENAI_API_VERSION
          value: {{ $model.ApiVersion | quote }}
        - name: AZURE_OPENAI_DEPLOYMENT_ID
          value: {{ $model.ChatGptEngine | quote }}
        - name: AZURE_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "rpi.secrets.secretName" . | quote }}
              key: RPI_NLP_API_KEY
        - name: SEED_RPI_MCP_URL
          value: {{ printf "http://rpi-mcpserver:%v/mcp" 3002 | quote }}
        - name: RPI_INTEGRATION_API_URL
          value: {{ printf "http://rpi-integrationapi:%v" $intCfg.service.port | quote }}
        - name: RPI_DEFAULT_CLIENT_ID
          value: {{ $mcp.defaultClientId | quote }}
        {{- with $rt.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: api
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: api
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ $name }}-data
      {{- if .Values.nodeSelector.enabled }}
      nodeSelector:
        {{ .Values.nodeSelector.key }}: {{ .Values.nodeSelector.value }}
      {{- end }}
      {{- if .Values.tolerations.enabled }}
      tolerations:
        - effect: NoSchedule
          key: {{ .Values.nodeSelector.key }}
          operator: Equal
          value: {{ .Values.nodeSelector.value }}
      {{- end }}
{{- end }}
