{{- $ws := (.Values.redpointAI | default dict).agentWorkspace | default dict -}}
{{- if $ws.enabled -}}

{{- $name := "rpi-aiweb" -}}
{{- $ingCfg := fromYaml (include "rpi.merged.ingress" .) -}}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "agentworkspace") | nindent 4 }}
  annotations:
    {{- include "rpi.ingress.annotations" . | nindent 4 }}
    # Chat responses stream token by token, so the route must not buffer.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: {{ $ingCfg.className }}
  {{- if eq $ingCfg.certificateSource "kubernetes" }}
  tls:
  {{- range $ingCfg.tls }}
  - secretName: {{ .secretName }}
    {{- if .hosts }}
    hosts:
    {{- range .hosts }}
      - {{ . }}
    {{- end }}
    {{- end }}
  {{- end }}
  {{- end }}
  rules:
    - host: {{ include "rpi.ingress.fqdn" (dict "host" $ingCfg.hosts.rpiaiweb "domain" $ingCfg.domain) }}
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ $name }}
              port:
                number: 3001
{{- end }}
