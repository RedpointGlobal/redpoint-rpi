{{- $npCfg := fromYaml (include "rpi.merged.networkPolicy" .) -}}
{{- $rtCfg := fromYaml (include "rpi.merged.service" (dict "root" . "name" "realtimeapi")) -}}
{{- $execCfg := fromYaml (include "rpi.merged.service" (dict "root" . "name" "executionservice")) -}}
{{- $obsCfg := fromYaml (include "rpi.merged.service" (dict "root" . "name" "observability")) -}}
{{- if $npCfg.enabled }}
# Default deny all ingress traffic in the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" "default-deny" "component" "network-policy") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# Allow ingress controller to reach API services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-apis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" "allow-ingress-to-apis" "component" "network-policy") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - rpi-realtimeapi
          - rpi-interactionapi
          - rpi-integrationapi
          - rpi-deploymentapi
          - rpi-callbackapi
          - rpi-queuereader
          {{- if $obsCfg.enabled }}
          - rpi-observability
          {{- end }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080

---
# Allow inter-service communication within RPI
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rpi-internal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" "allow-rpi-internal" "component" "network-policy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: rpi
      app.kubernetes.io/part-of: smartactivation
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: rpi
              app.kubernetes.io/part-of: smartactivation

{{- if eq (include "rpi.telemetry.enabled" .) "true" }}
---
# Runtime tracing: the RPI pods reach the collector sidecar in the
# Observability pod on the OTLP ports. The sidecar's delivery to the
# application stays on the pod's loopback, which no policy governs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rpi-telemetry-to-observability
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" "allow-rpi-telemetry-to-observability" "component" "network-policy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rpi-observability
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: rpi
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
{{- end }}

---
# Allow Redis access from services that need it
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-access
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" "allow-redis-access" "component" "network-policy") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - rpi-realtimeapi-cache
          - rpi-queuereader-cache
          - rpi-twiliomessaging-cache
          - cdp-cache
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: rpi
              app.kubernetes.io/part-of: smartactivation
      ports:
        - protocol: TCP
          port: 6379

---
# Allow RabbitMQ access from services that need it
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rabbitmq-access
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" "allow-rabbitmq-access" "component" "network-policy") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - rpi-realtimeapi-rabbitmq
          - rpi-queuereader-rabbitmq
          - cdp-messageq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: rpi
              app.kubernetes.io/part-of: smartactivation
      ports:
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 15672

---
# Allow Prometheus scraping if custom metrics are enabled
{{- if or .Values.customMetrics.enabled $rtCfg.customMetrics.enabled $execCfg.customMetrics.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" "allow-prometheus-scrape" "component" "network-policy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: rpi
      app.kubernetes.io/part-of: smartactivation
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
{{- end }}

{{- if $npCfg.allowDNS }}
---
# Allow DNS resolution for all pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" "allow-dns" "component" "network-policy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: rpi
      app.kubernetes.io/part-of: smartactivation
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}

---
# Default deny all egress traffic to enforce least-privilege networking.
# Explicit egress policies below allow only necessary outbound communication.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" "default-deny-egress" "component" "network-policy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: rpi
      app.kubernetes.io/part-of: smartactivation
  policyTypes:
    - Egress

---
# Allow egress between RPI internal services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rpi-internal-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" "allow-rpi-internal-egress" "component" "network-policy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: rpi
      app.kubernetes.io/part-of: smartactivation
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: rpi

---
# Allow egress to external databases and cloud services (HTTPS)
# This permits outbound connections to databases, cloud APIs, and SMTP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" "allow-external-egress" "component" "network-policy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: rpi
      app.kubernetes.io/part-of: smartactivation
  policyTypes:
    - Egress
  egress:
    # Allow HTTPS egress (cloud APIs, external services)
    - ports:
        - protocol: TCP
          port: 443
    # Allow database egress (SQL Server)
    - ports:
        - protocol: TCP
          port: 1433
    # Allow database egress (PostgreSQL)
    - ports:
        - protocol: TCP
          port: 5432
    # Allow database egress (MongoDB)
    - ports:
        - protocol: TCP
          port: 27017
    # Allow SMTP egress
    - ports:
        - protocol: TCP
          port: {{ .Values.SMTPSettings.SMTP_Port | default 587 }}
    {{- with $npCfg.additionalEgressPorts }}
    # Operator-listed ports, such as a database server on a non-default port
    - ports:
        {{- range . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}

---
# Block access to cloud instance metadata endpoints (169.254.169.254)
# Prevents SSRF attacks from reaching cloud provider metadata services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-cloud-metadata
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" "deny-cloud-metadata" "component" "network-policy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: rpi
      app.kubernetes.io/part-of: smartactivation
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
{{- if $obsCfg.enabled }}
{{- $platform := .Values.global.deployment.platform }}

---
# RPI Observability reaches only what it reads: the RPI services whose metrics
# it reads, and the Interaction API for sign-in, on their pod port; the
# operational database server, HTTPS endpoints (identity
# providers, cloud identity and vaults, the Kubernetes API) and SMTP. The
# pod's cloud identity endpoint is allowed only where the platform issues
# workload identity tokens through it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rpi-observability-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" "allow-rpi-observability-egress" "component" "network-policy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rpi-observability
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - rpi-executionservice
                  - rpi-nodemanager
                  - rpi-queuereader
                  - rpi-interactionapi
                  - rpi-integrationapi
                  - rpi-realtimeapi
                  - rpi-callbackapi
      ports:
        - protocol: TCP
          port: 8080
    {{- if $npCfg.allowDNS }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 1433
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: {{ .Values.SMTPSettings.SMTP_Port | default 587 }}
    {{- with $npCfg.additionalEgressPorts }}
    # Operator-listed ports, such as a database server on a non-default port
    - ports:
        {{- range . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- if eq $platform "selfhosted" }}
    # Self-managed control planes commonly serve the Kubernetes API on 6443.
    - ports:
        - protocol: TCP
          port: 6443
    {{- end }}
    {{- if and (eq $platform "azure") (eq .Values.databases.operational.provider "sqlserver") }}
    # Azure SQL redirects connections from inside Azure to the database node
    # on 11000-11999 after the gateway on 1433.
    - ports:
        - protocol: TCP
          port: 11000
          endPort: 11999
    {{- end }}
    {{- if eq (include "rpi.cloudSqlProxy.enabled" .) "true" }}
    # The Cloud SQL Auth Proxy sidecar reaches the instance on 3307.
    - ports:
        - protocol: TCP
          port: 3307
    {{- end }}
    {{- if and .Values.cloudIdentity.enabled (eq $platform "google") }}
    # GKE Workload Identity issues tokens from the GKE metadata server:
    # 169.254.169.252 on 987 and 988, or 169.254.169.254 on 80 and 8080
    # with GKE Dataplane V2.
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 987
        - protocol: TCP
          port: 988
    {{- end }}
    {{- if and .Values.cloudIdentity.enabled (eq $platform "amazon") }}
    # EKS Pod Identity issues credentials from the node agent.
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - protocol: TCP
          port: 80
    {{- end }}

---
# The RPI services RPI Observability reads admit it on their pod port, for
# their metrics and, on the Interaction API, sign-in. default-deny-ingress
# selects them and no other policy admits Observability.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rpi-observability-to-rpi
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" "allow-rpi-observability-to-rpi" "component" "network-policy") | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - rpi-executionservice
          - rpi-nodemanager
          - rpi-queuereader
          - rpi-interactionapi
          - rpi-integrationapi
          - rpi-realtimeapi
          - rpi-callbackapi
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rpi-observability
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
{{- end }}
