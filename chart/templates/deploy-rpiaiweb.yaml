{{- $ai := .Values.redpointAI | default dict -}}
{{- $ws := $ai.agentWorkspace | default dict -}}
{{- if $ws.enabled -}}

{{- $name := "rpi-aiweb" -}}
{{- $web := $ws.web | default dict -}}
{{- $mcp := (.Values.mcpServers | default dict).rpi | default dict -}}
{{- $ingCfg := fromYaml (include "rpi.merged.ingress" .) -}}
{{- $intCfg := fromYaml (include "rpi.merged.service" (dict "root" . "name" "integrationapi")) -}}

{{- include "rpi.block.serviceAccount" (dict "root" . "name" $name "component" "agentworkspace" "cfg" (dict "enabled" true "serviceAccount" ($web.serviceAccount | default (dict "enabled" true)))) }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "agentworkspace") | nindent 4 }}
spec:
  ports:
  - name: http
    port: 3001
    protocol: TCP
    targetPort: web
  selector:
    app.kubernetes.io/name: {{ $name }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "agentworkspace") | nindent 4 }}
    app.kubernetes.io/version: {{ .Values.global.deployment.images.tag | quote }}
spec:
  replicas: {{ $web.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "agentworkspace") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "rpi.serviceAccountName" (dict "root" . "name" $name "cfg" (dict "serviceAccount" ($web.serviceAccount | default (dict "enabled" true)))) }}
      {{- if .Values.global.deployment.images.imagePullSecret.enabled }}
      imagePullSecrets:
        - name: {{ .Values.global.deployment.images.imagePullSecret.name }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
      - name: {{ $name }}
        image: {{ include "rpi.image" (dict "root" . "name" $name) }}
        imagePullPolicy: {{ .Values.global.deployment.images.imagePullPolicy | default "IfNotPresent" }}
        ports:
        - name: web
          containerPort: 3001
          protocol: TCP
        env:
        - name: PORT
          value: "3001"
        # The browser never reaches the API directly. This is read by the
        # Next.js route handlers, which proxy to it in namespace.
        - name: NEXT_PUBLIC_API_URL
          value: "http://rpi-aiserver:3000"
        - name: AUTH_REQUIRED
          value: "true"
        # Generated by the chart and preserved across upgrades. Never an
        # operator populated value.
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "rpi.secrets.internalSecretName" . | quote }}
              key: RPI_AI_Auth_Secret
        # The canonical URL the session uses for its sign in redirects. Without
        # it the pod's bind address leaks into them.
        - name: AUTH_URL
          value: {{ printf "https://%s" (include "rpi.ingress.fqdn" (dict "host" $ingCfg.hosts.rpiaiweb "domain" $ingCfg.domain)) | quote }}
        # Users sign in with their RPI credentials, so the login path needs the
        # same RPI OAuth client the MCP server uses.
        - name: RPI_INTEGRATION_API_URL
          value: {{ printf "http://rpi-integrationapi:%v" $intCfg.service.port | quote }}
        - name: RPI_OAUTH_CLIENT_ID
          value: {{ $mcp.oauthClientId | quote }}
        - name: RPI_DEFAULT_CLIENT_ID
          value: {{ $mcp.defaultClientId | quote }}
        - name: RPI_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "rpi.secrets.secretName" . | quote }}
              key: RPI_MCP_OAuth_Client_Secret
        {{- with $web.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        # The application serves no health path of its own, so the root
        # document is the liveness signal.
        livenessProbe:
          httpGet:
            path: /
            port: web
          initialDelaySeconds: 20
          periodSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: web
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
      {{- if .Values.nodeSelector.enabled }}
      nodeSelector:
        {{ .Values.nodeSelector.key }}: {{ .Values.nodeSelector.value }}
      {{- end }}
      {{- if .Values.tolerations.enabled }}
      tolerations:
        - effect: NoSchedule
          key: {{ .Values.nodeSelector.key }}
          operator: Equal
          value: {{ .Values.nodeSelector.value }}
      {{- end }}
{{- end }}
