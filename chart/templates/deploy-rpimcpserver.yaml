{{- $ai := .Values.redpointAI | default dict -}}
{{- $user := $ai.mcp | default dict -}}
{{- if $user.enabled -}}

{{- $name := "rpi-mcpserver" -}}
{{- $d := fromYaml (include "rpi.defaults.rpimcpserver" .) -}}
{{- $cfg := mustMergeOverwrite $d $user -}}
{{- $port := $cfg.service.port -}}
{{- $auth := $cfg.auth | default dict -}}
{{- $proxy := $auth.proxy | default dict -}}
{{- $secCtx := $cfg.securityContext -}}
{{- $intCfg := fromYaml (include "rpi.merged.service" (dict "root" . "name" "integrationapi")) -}}
{{- $ingCfg := fromYaml (include "rpi.merged.ingress" .) -}}
{{- $authRequired := true -}}
{{- if hasKey $auth "required" }}{{- $authRequired = $auth.required -}}{{- end -}}

{{- if eq .Values.secretsManagement.provider "sdk" -}}
{{- fail "redpointAI.mcp.enabled=true requires secretsManagement.provider 'kubernetes' or 'csi'. The MCP server resolves its credentials from environment bindings and cannot read a cloud vault, so under 'sdk' it would start without credentials and serve no tools." -}}
{{- end -}}

{{- if ne (int $cfg.replicaCount) 1 -}}
{{- fail "redpointAI.mcp.replicaCount must be 1. MCP sessions are held in the server process, so a request routed to another replica resolves to a different session." -}}
{{- end -}}

{{- if not $cfg.defaultClientId -}}
{{- fail "redpointAI.mcp.defaultClientId is required when redpointAI.mcp.enabled=true. It is the RPI tenant identifier (a GUID) the tooling serves: SELECT ClientID FROM Pulse_<env>.dbo.rpi_Clients." -}}
{{- end -}}

{{- /* The server registers no tools without both OAuth variables, even
       when it never mints a token. */ -}}
{{- if not $cfg.oauthClientId -}}
{{- fail "redpointAI.mcp.oauthClientId is required when redpointAI.mcp.enabled=true. It is the Integration API OAuth application the server is registered as; without it the server starts with no tools. The matching secret is the Secret key RPI_AI_OAuth_Client_Secret." -}}
{{- end -}}

{{- if $proxy.enabled -}}
{{- if not $proxy.user -}}
{{- fail "redpointAI.mcp.auth.proxy.user is required when redpointAI.mcp.auth.proxy.enabled=true. The identifier is not sensitive; its password is the Secret key RPI_MCP_Proxy_Pass." -}}
{{- end -}}
{{- end -}}

{{- include "rpi.block.serviceAccount" (dict "root" . "name" $name "component" "mcpserver" "cfg" $cfg) }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "mcpserver") | nindent 4 }}
  {{- $svcAnnotations := include "rpi.mergedAnnotations" (dict "root" . "type" "service") | trim }}
  {{- if $svcAnnotations }}
  annotations:
    {{- $svcAnnotations | nindent 4 }}
  {{- end }}
spec:
  ports:
  - name: http
    port: {{ $port }}
    protocol: TCP
    targetPort: mcp
  selector:
    app.kubernetes.io/name: {{ $name }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "mcpserver") | nindent 4 }}
    app.kubernetes.io/version: {{ .Values.global.deployment.images.tag | quote }}
    {{- with .Values.customLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.customAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "mcpserver") | nindent 8 }}
      {{- $podAnnotations := include "rpi.mergedAnnotations" (dict "root" . "type" "pod") | trim }}
      {{- if $podAnnotations }}
      annotations:
        {{- $podAnnotations | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "rpi.serviceAccountName" (dict "root" . "name" $name "cfg" $cfg) }}
      {{- if .Values.global.deployment.images.imagePullSecret.enabled }}
      imagePullSecrets:
        - name: {{ .Values.global.deployment.images.imagePullSecret.name }}
      {{- end }}
      # The server does not drain on SIGTERM; covers the longest tool poll.
      terminationGracePeriodSeconds: {{ $cfg.terminationGracePeriodSeconds | default 240 }}
      securityContext:
        runAsUser: {{ $secCtx.runAsUser | default 1000 }}
        runAsGroup: {{ $secCtx.runAsGroup | default 1000 }}
        runAsNonRoot: true
      containers:
      - name: {{ $name }}
        image: {{ include "rpi.image" (dict "root" . "name" $name) }}
        imagePullPolicy: {{ .Values.global.deployment.images.imagePullPolicy | default "IfNotPresent" }}
        ports:
        - name: mcp
          containerPort: {{ $port }}
          protocol: TCP
        env:
        - name: RPI_MCP_HTTP_PORT
          value: {{ $port | quote }}
        - name: RPI_INTEGRATION_API_URL
          value: {{ printf "http://rpi-integrationapi:%v" $intCfg.service.port | quote }}
        - name: RPI_DEFAULT_CLIENT_ID
          value: {{ $cfg.defaultClientId | quote }}
        - name: AUTH_REQUIRED
          value: {{ $authRequired | quote }}
        # Origin published in OAuth metadata, else taken from forwarded headers.
        - name: RPI_MCP_PUBLIC_URL
          value: {{ printf "https://%s" (include "rpi.ingress.fqdn" (dict "host" $ingCfg.hosts.rpimcpserver "domain" $ingCfg.domain)) | quote }}
        - name: RPI_OAUTH_CLIENT_ID
          value: {{ $cfg.oauthClientId | quote }}
        - name: RPI_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "rpi.secrets.secretName" . | quote }}
              key: RPI_AI_OAuth_Client_Secret
        {{- if $proxy.enabled }}
        - name: RPI_PROXY_ENABLED
          value: "true"
        - name: RPI_PROXY_USER
          value: {{ $proxy.user | quote }}
        - name: RPI_PROXY_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "rpi.secrets.secretName" . | quote }}
              key: RPI_MCP_Proxy_Pass
        {{- else }}
        - name: RPI_PROXY_ENABLED
          value: "false"
        {{- end }}
        {{- include "rpi.customCACerts.envVar" . | nindent 8 }}
        {{- with $cfg.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # /health answers without RPI credentials, reporting mcp: degraded.
        livenessProbe:
          httpGet:
            path: /health
            port: mcp
          initialDelaySeconds: 20
          periodSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: mcp
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        {{- include "rpi.customCACerts.volumeMount" . | nindent 8 }}
      volumes:
      # Writable /tmp for the read only root filesystem.
      - name: tmp
        emptyDir: {}
      {{- include "rpi.customCACerts.volume" . | nindent 6 }}
      {{- if .Values.nodeSelector.enabled }}
      nodeSelector:
        {{ .Values.nodeSelector.key }}: {{ .Values.nodeSelector.value }}
      {{- end }}
      {{- if .Values.tolerations.enabled }}
      tolerations:
        - effect: NoSchedule
          key: {{ .Values.nodeSelector.key }}
          operator: Equal
          value: {{ .Values.nodeSelector.value }}
      {{- end }}
{{- end }}
