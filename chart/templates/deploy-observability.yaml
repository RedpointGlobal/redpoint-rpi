
{{- $cfg := .Values.observability | default dict -}}
{{- if $cfg.enabled -}}

{{- $name := "rpi-observability" -}}
{{- $service := $cfg.service | default dict -}}
{{- $resources := $cfg.resources | default dict -}}
{{- $storage := $cfg.storage | default dict -}}
{{- $vct := $storage.volumeClaimTemplates | default dict -}}
{{- $secCtx := fromYaml (include "rpi.merged.securityContext" .) -}}

{{- $fileOutPvc := (.Values.storage.persistentVolumeClaims | default dict).FileOutputDirectory | default dict -}}
{{- $diagFileOut := (($cfg.diagnostics | default dict).fileOutput | default dict) -}}
{{- $mountFileOut := and $diagFileOut.enabled $fileOutPvc.enabled -}}

{{- include "rpi.block.serviceAccount" (dict "root" . "name" $name "component" "observability" "cfg" $cfg) }}

---
# Read-only K8s API access for the observability service's pod-health
# and event collectors. Namespace-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "observability") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # PersistentVolumeClaims back the engine pages' Backing storage panel
  # (capacity + which service mounts each claim). Read-only.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
  # metrics-server. Optional; if absent, CPU/memory columns show "-".
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  {{- if .Values.observability.loadTest.enabled }}
  # Load Tests: Observability launches k6 as an ephemeral Job (System-
  # Administrator-gated) and reads its state + pod log to harvest the result.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  # Read the shared Secret to confirm (by key presence) the RPI load-test
  # account is configured; values are injected into the Job via secretKeyRef,
  # never read into the Observability process.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: [{{ include "rpi.secrets.secretName" . | quote }}]
  {{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "observability") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "rpi.serviceAccountName" (dict "root" . "name" $name "cfg" $cfg) }}
    namespace: {{ .Release.Namespace }}

{{- if (($cfg.nodeHealth | default dict).enabled | default false) }}
---
# Node health needs a ClusterRole (nodes are cluster-scoped); names are
# namespace-suffixed so multiple installs don't collide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-nodes-{{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "observability") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # metrics-server. Optional; if absent, CPU/memory columns show "-".
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-nodes-{{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "observability") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-nodes-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "rpi.serviceAccountName" (dict "root" . "name" $name "cfg" $cfg) }}
    namespace: {{ .Release.Namespace }}
{{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" (printf "%s-api" $name) "component" "observability-api") | nindent 4 }}
  {{- $svcAnnotations := include "rpi.mergedAnnotations" (dict "root" . "type" "service") | trim }}
  {{- if $svcAnnotations }}
  annotations:
    {{- $svcAnnotations | nindent 4 }}
  {{- end }}
spec:
  ports:
  - name: http
    port: {{ $service.apiPort | default 8080 }}
    protocol: TCP
    targetPort: api
  {{- if eq (include "rpi.telemetry.mode.otel" .) "true" }}
  # Advanced telemetry: OTLP intake for the bundled telemetry bridge.
  - name: otlp
    port: 4317
    protocol: TCP
    targetPort: otlp
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ $name }}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "observability") | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "observability") | nindent 8 }}
        {{- with (include "rpi.cloudidentity.podLabels" (dict "root" . "svcCloudIdentity" (hasKey $cfg "cloudIdentity" | ternary $cfg.cloudIdentity false)) | trim) }}{{- . | nindent 8 }}{{- end }}
      {{- $podAnnotations := include "rpi.mergedAnnotations" (dict "root" . "type" "pod") | trim }}
      {{- if $podAnnotations }}
      annotations:
        {{- $podAnnotations | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "rpi.serviceAccountName" (dict "root" . "name" $name "cfg" $cfg) }}
      {{- if .Values.global.deployment.images.imagePullSecret.enabled }}
      imagePullSecrets:
        - name: {{ .Values.global.deployment.images.imagePullSecret.name }}
      {{- end }}
      securityContext:
        fsGroup: 7777
        fsGroupChangePolicy: OnRootMismatch
        {{- with $secCtx.pod }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
      - name: {{ $name }}
        image: {{ include "rpi.image" (dict "root" . "name" "rpi-observability") }}
        imagePullPolicy: {{ .Values.global.deployment.images.imagePullPolicy | default "IfNotPresent" }}
        ports:
        - name: api
          containerPort: {{ $service.apiPort | default 8080 }}
          protocol: TCP
        env:
        # lets the K8s events collector know which
        # namespace to scope its event/pod queries to.
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- if .Values.observability.loadTest.enabled }}
        # Load Tests: the image the launcher runs k6 Jobs with (its own), and the
        # shared Secret name to source the RPI load-test account from (by
        # secretKeyRef on the Job; values never enter this process).
        - name: OBSERVABILITY__IMAGE
          value: {{ include "rpi.image" (dict "root" . "name" "rpi-observability") | quote }}
        - name: OBSERVABILITY__SECRET_NAME
          value: {{ include "rpi.secrets.secretName" . | quote }}
        {{- end }}
        {{- include "rpi.observability.intelligenceEnvvars" . | nindent 8 }}
        {{- include "rpi.observability.runtimeEnvvars" . | nindent 8 }}
        {{- include "rpi.observability.authEnvvars" . | nindent 8 }}
        {{- with (include "rpi.secrets.sdk.envvars" . | trim) }}{{- . | nindent 8 }}{{- end }}
        {{- with (include "rpi.cloudidentity.envvars" . | trim) }}{{- . | nindent 8 }}{{- end }}
        {{- with (include "rpi.cloudidentity.awsAccessKeyEnvvars" . | trim) }}{{- . | nindent 8 }}{{- end }}
        {{- include "rpi.customCACerts.envVar" . | nindent 8 }}
        {{- with $resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $secCtx.container }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        readinessProbe:
          httpGet:
            path: /health/ready
            port: api
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 30       
        livenessProbe:
          httpGet:
            path: /health/live
            port: api
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 10 
        volumeMounts:
        - name: {{ $name }}-data
          mountPath: /data
        {{- if $mountFileOut }}
        - name: fileoutputdirectory
          mountPath: /rpifileoutputdir
          readOnly: false
        {{- end }}
        {{- include "rpi.cloudidentity.googleVolumeMounts" . | nindent 8 }}
        {{- include "rpi.customCACerts.volumeMount" . | nindent 8 }}
      {{- if eq (include "rpi.telemetry.mode.otel" .) "true" }}
      # Private OTLP -> Prometheus bridge for the observability application only:
      # :4317 is exposed through the Service, :8889 stays pod-private.
      - name: telemetry-bridge
        image: {{ include "rpi.image" (dict "root" . "name" "rpi-observability") }}
        imagePullPolicy: {{ .Values.global.deployment.images.imagePullPolicy | default "IfNotPresent" }}
        command: ["/usr/local/bin/otelcol", "--config=/etc/otelcol/config.yaml"]
        ports:
        - name: otlp
          containerPort: 4317
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 400Mi
        {{- with $secCtx.container }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      volumes:
      {{- if $storage.existingClaim }}
      - name: {{ $name }}-data
        persistentVolumeClaim:
          claimName: {{ $storage.existingClaim | quote }}
      {{- else if not $vct.enabled }}
      - name: {{ $name }}-data
        emptyDir: {}
      {{- end }}
      {{- if $mountFileOut }}
      - name: fileoutputdirectory
        persistentVolumeClaim:
          claimName: {{ $fileOutPvc.claimName | quote }}
          readOnly: false
      {{- end }}
      {{- include "rpi.cloudidentity.googleVolumes" . | nindent 6 }}
      {{- include "rpi.customCACerts.volume" . | nindent 6 }}
      {{- if .Values.nodeSelector.enabled }}
      nodeSelector:
        {{ .Values.nodeSelector.key }}: {{ .Values.nodeSelector.value }}
      {{- end }}
      {{- if .Values.tolerations.enabled }}
      tolerations:
        - effect: NoSchedule
          key: {{ .Values.nodeSelector.key }}
          operator: Equal
          value: {{ .Values.nodeSelector.value }}
      {{- end }}
  {{- if and $vct.enabled (not $storage.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: {{ $name }}-data
      spec:
        accessModes:
          - {{ $vct.accessModes | default "ReadWriteOnce" }}
        {{- if $vct.storageClassName }}
        storageClassName: {{ $vct.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $vct.storage | default "5Gi" | quote }}
  {{- end }}
{{- end }}
