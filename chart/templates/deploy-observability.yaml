{{- $cfg := fromYaml (include "rpi.merged.service" (dict "root" . "name" "observability")) -}}
{{- if $cfg.enabled -}}

{{- $name := "rpi-observability" -}}
{{- $secCtx := fromYaml (include "rpi.merged.securityContext" .) -}}
{{- $ingCfg := fromYaml (include "rpi.merged.ingress" .) -}}
{{- $iaCfg := fromYaml (include "rpi.merged.service" (dict "root" . "name" "interactionapi")) -}}
{{- $auth := $cfg.authentication | default dict -}}
{{- $fanout := $cfg.tenantFanout | default dict -}}
{{- $storage := $cfg.sessionKeyStorage | default dict -}}
{{- $db := .Values.databases.operational -}}
{{- $sdk := eq .Values.secretsManagement.provider "sdk" -}}
{{- $tel := $cfg.telemetry | default dict -}}
{{- $rec := $tel.recorder | default dict -}}
{{- $serviceAccount := include "rpi.serviceAccountName" (dict "root" . "name" $name "cfg" $cfg) -}}

{{- if ne (int $cfg.replicaCount) 1 -}}
{{- fail "observability.replicaCount must be 1. The analysis scheduler and the Observability database writers run in-process, so a second replica would run a second writer." -}}
{{- end -}}

{{- if not $cfg.clientId -}}
{{- fail "observability.clientId is required when observability.enabled=true. It is the RPI tenant identifier (a GUID): SELECT ClientID FROM Pulse_<env>.dbo.rpi_Clients." -}}
{{- end -}}

{{- if not $cfg.databaseName -}}
{{- fail "observability.databaseName is required when observability.enabled=true. Create the database on the operational database server and make the operational login its owner before installing." -}}
{{- end -}}

{{- if and $auth.enabled (not $iaCfg.enabled) -}}
{{- fail "observability.authentication.enabled=true requires interactionapi.enabled=true. Observability reads its identity providers and the signed-in user from the Interaction API." -}}
{{- end -}}

{{- include "rpi.block.serviceAccount" (dict "root" . "name" $name "component" "observability" "cfg" $cfg) }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "observability") | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods", "events"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "observability") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ $serviceAccount }}
  namespace: {{ .Release.Namespace }}

---
# Node health reads cluster-scoped resources; the name carries the namespace so releases do not collide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s" $name .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "observability") | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["list"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes"]
  verbs: ["list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s" $name .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "observability") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s" $name .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: {{ $serviceAccount }}
  namespace: {{ .Release.Namespace }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-data" $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "observability") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if $storage.storageClassName }}
  storageClassName: {{ $storage.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $storage.size | default "1Gi" }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "observability") | nindent 4 }}
  {{- $svcAnnotations := include "rpi.mergedAnnotations" (dict "root" . "type" "service") | trim }}
  {{- if $svcAnnotations }}
  annotations:
    {{- $svcAnnotations | nindent 4 }}
  {{- end }}
spec:
  ports:
  - name: http
    port: {{ $cfg.service.port }}
    protocol: TCP
    targetPort: http
  {{- if $tel.enabled }}
  # The RPI services send their spans here; the ports reach the collector
  # sidecar in the Observability pod. Never exposed through the Ingress.
  - name: otlp-grpc
    port: 4317
    protocol: TCP
    targetPort: otlp-grpc
  - name: otlp-http
    port: 4318
    protocol: TCP
    targetPort: otlp-http
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ $name }}

{{- if $tel.enabled }}
---
# The collector sidecar's configuration. The pod's init step copies it into
# the memory backed telemetry volume with the ingest token in place of the
# placeholder, so the token appears in no manifest, Secret or ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-collector" $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "observability") | nindent 4 }}
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 400
        spike_limit_mib: 100
      batch:
        timeout: 5s
        send_batch_size: 512
        send_batch_max_size: 2000
    exporters:
      otlphttp/observability:
        endpoint: http://127.0.0.1:8080/api/telemetry
        encoding: json
        compression: none
        headers:
          Authorization: "Bearer __OBSERVABILITY_INGEST_TOKEN__"
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 120s
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 200
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: warn
        metrics:
          level: none
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/observability]
{{- end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "observability") | nindent 4 }}
    {{- with .Values.customLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.customAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "redpoint-rpi.componentLabels" (dict "root" . "name" $name "component" "observability") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with (include "rpi.cloudidentity.podLabels" (dict "root" .) | trim) }}{{- . | nindent 8 }}{{- end }}
      {{- $podAnnotations := include "rpi.mergedAnnotations" (dict "root" . "type" "pod") | trim }}
      {{- $meshAnnotations := include "rpi.serviceMesh.podAnnotations" (dict "root" .) | trim }}
      {{- if or $podAnnotations $meshAnnotations }}
      annotations:
        {{- with $podAnnotations }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with $meshAnnotations }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ $serviceAccount }}
      {{- if .Values.global.deployment.images.imagePullSecret.enabled }}
      imagePullSecrets:
        - name: {{ .Values.global.deployment.images.imagePullSecret.name }}
      {{- end }}
      {{- include "rpi.pod.securityContext" (dict "sc" $secCtx) | nindent 6 }}
      {{- if or $tel.enabled (eq (include "rpi.cloudSqlProxy.enabled" .) "true") }}
      initContainers:
      {{- if $tel.enabled }}
      # Writes the ingest token (256 random bits) and the collector's
      # configuration into the memory backed telemetry volume, readable by
      # the owner only. Both consumers run as the same user and read them.
      - name: telemetry-init
        image: {{ include "rpi.image" (dict "root" . "name" $name) }}
        imagePullPolicy: {{ .Values.global.deployment.images.imagePullPolicy | default "IfNotPresent" }}
        command: ["python", "-m", "app.telemetry.init", "--template", "/conf/collector.yaml", "--dir", "/run/telemetry"]
        securityContext:
          runAsUser: {{ $secCtx.runAsUser }}
          runAsGroup: {{ $secCtx.runAsGroup }}
          runAsNonRoot: true
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: collector-template
          mountPath: /conf
          readOnly: true
        - name: telemetry
          mountPath: /run/telemetry
      {{- end }}
      {{- if eq (include "rpi.cloudSqlProxy.enabled" .) "true" }}
        {{- include "rpi.block.cloudSqlProxy.sidecar" . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
      - name: {{ $name }}
        image: {{ include "rpi.image" (dict "root" . "name" $name) }}
        imagePullPolicy: {{ .Values.global.deployment.images.imagePullPolicy | default "IfNotPresent" }}
        {{- include "rpi.container.securityContext" (dict "sc" $secCtx) | nindent 8 }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        {{- with (include "rpi.commonEnvVars" . | trim) }}{{- . | nindent 8 }}{{- end }}
        # The namespace Observability reads pods, events and metrics in: its own.
        - name: POD_NAMESPACE
          value: {{ .Release.Namespace | quote }}
        - name: OBSERVABILITY__CLIENT_ID
          value: {{ $cfg.clientId | quote }}
        - name: OBSERVABILITY__DATABASE__NAME
          value: {{ $cfg.databaseName | quote }}
        - name: OBSERVABILITY__SCHEDULE__INTERVAL_MINUTES
          value: {{ $cfg.schedule.intervalMinutes | quote }}
        - name: OBSERVABILITY__EVIDENCE__COVERAGE_STALE_AFTER_MINUTES
          value: {{ $cfg.evidence.coverageStaleAfterMinutes | quote }}
        - name: OBSERVABILITY__TENANT_FANOUT__ENABLED
          value: {{ $fanout.enabled | quote }}
        - name: OBSERVABILITY__TENANT_FANOUT__MAX_CONCURRENCY
          value: {{ $fanout.maxConcurrency | quote }}
        - name: OBSERVABILITY__TENANT_FANOUT__PER_TENANT_TIMEOUT
          value: {{ $fanout.perTenantTimeoutSeconds | quote }}
        - name: OBSERVABILITY__TENANT_FANOUT__CYCLE_BUDGET_SECONDS
          value: {{ $fanout.cycleBudgetSeconds | quote }}
        - name: OBSERVABILITY__TENANT_FANOUT__STALE_AFTER_MINUTES
          value: {{ $fanout.staleAfterMinutes | quote }}
        - name: OBSERVABILITY__TELEMETRY__ENABLED
          value: {{ $tel.enabled | default false | quote }}
        {{- if $tel.enabled }}
        - name: OBSERVABILITY__TELEMETRY__INGEST_TOKEN_FILE
          value: "/run/telemetry/token"
        - name: OBSERVABILITY__TELEMETRY__RETENTION_MINUTES
          value: {{ $rec.retentionMinutes | default 60 | quote }}
        - name: OBSERVABILITY__TELEMETRY__MAX_SPANS
          value: {{ $rec.maxSpans | default 200000 | quote }}
        - name: OBSERVABILITY__TELEMETRY__INCIDENT_BEFORE_MINUTES
          value: {{ $rec.incidentBeforeMinutes | default 10 | quote }}
        - name: OBSERVABILITY__TELEMETRY__INCIDENT_AFTER_MINUTES
          value: {{ $rec.incidentAfterMinutes | default 10 | quote }}
        - name: OBSERVABILITY__TELEMETRY__MAX_WINDOWS
          value: {{ $rec.maxWindows | default 50 | quote }}
        {{- end }}
        {{- if not $sdk }}
        - name: ClusterEnvironment__OperationalDatabase__ConnectionSettings__Server
          valueFrom:
            secretKeyRef:
              name: {{ include "rpi.secrets.secretName" . | quote }}
              key: Operations_Database_ServerHost
        - name: ClusterEnvironment__OperationalDatabase__ConnectionSettings__Username
          valueFrom:
            secretKeyRef:
              name: {{ include "rpi.secrets.secretName" . | quote }}
              key: Operations_Database_Server_Username
        - name: ClusterEnvironment__OperationalDatabase__ConnectionSettings__Password
          valueFrom:
            secretKeyRef:
              name: {{ include "rpi.secrets.secretName" . | quote }}
              key: Operations_Database_Server_Password
        - name: ClusterEnvironment__OperationalDatabase__PulseDatabaseName
          valueFrom:
            secretKeyRef:
              name: {{ include "rpi.secrets.secretName" . | quote }}
              key: Operations_Database_Pulse_Database_Name
        - name: ClusterEnvironment__OperationalDatabase__LoggingDatabaseName
          valueFrom:
            secretKeyRef:
              name: {{ include "rpi.secrets.secretName" . | quote }}
              key: Operations_Database_Pulse_Logging_Database_Name
        # Sign in as RPI's Deployment API does: with the username and password
        # outside sdk mode, and as the vault's IsUsingCredentials selects in sdk mode.
        - name: ClusterEnvironment__OperationalDatabase__ConnectionSettings__IsUsingCredentials
          value: "true"
        {{- end }}
        - name: ClusterEnvironment__OperationalDatabase__ConnectionSettings__SQLServerSettings__Encrypt
          value: {{ $db.encrypt | quote }}
        {{- if eq $db.provider "sqlserver" }}
        {{- if eq .Values.global.deployment.platform "amazon" }}
        - name: ClusterEnvironment__OperationalDatabase__DatabaseType
          value: "AmazonRDSSQL"
        {{- else if eq .Values.global.deployment.platform "azure" }}
        - name: ClusterEnvironment__OperationalDatabase__DatabaseType
          value: "AzureSQLDatabase"
        {{- else if eq .Values.global.deployment.platform "google" }}
        - name: ClusterEnvironment__OperationalDatabase__DatabaseType
          value: "GoogleCloudSQL"
        {{- else }}
        - name: ClusterEnvironment__OperationalDatabase__DatabaseType
          value: "SQLServer"
        {{- end }}
        {{- else if eq $db.provider "sqlserveronvm" }}
        - name: ClusterEnvironment__OperationalDatabase__DatabaseType
          value: "SQLServer"
        {{- else if eq $db.provider "postgresql" }}
        - name: ClusterEnvironment__OperationalDatabase__DatabaseType
          value: "PostgreSQL"
        # The port RPI's Deployment API receives. A port in the server value wins.
        - name: ClusterEnvironment__OperationalDatabase__ConnectionSettings__Port
          value: "5432"
        {{- end }}
        {{- with (include "rpi.operationalDatabaseType.envvar" . | trim) }}{{- . | nindent 8 }}{{- end }}
        {{- with (include "rpi.secrets.sdk.envvars" . | trim) }}{{- . | nindent 8 }}{{- end }}
        {{- with (include "rpi.cloudidentity.envvars" . | trim) }}{{- . | nindent 8 }}{{- end }}
        {{- with (include "rpi.cloudidentity.awsAccessKeyEnvvars" . | trim) }}{{- . | nindent 8 }}{{- end }}
        - name: OBSERVABILITY__AUTH__ENABLED
          value: {{ $auth.enabled | default false | quote }}
        {{- if $auth.enabled }}
        - name: OBSERVABILITY__AUTH__COOKIE_SECURE
          value: {{ $auth.cookieSecure | quote }}
        - name: OBSERVABILITY__AUTH__SESSION_LIFETIME_SECONDS
          value: {{ $auth.sessionLifetimeSeconds | quote }}
        - name: OBSERVABILITY__AUTH__CAPABILITY_MAP
          value: {{ $auth.capabilityMap | default dict | toJson | quote }}
        - name: OBSERVABILITY__AUTH__INGRESS_HOST
          value: {{ include "rpi.ingress.fqdn" (dict "host" $ingCfg.hosts.observability "domain" $ingCfg.domain) | quote }}
        # RPI supplies the identity providers and resolves the signed-in user.
        - name: OBSERVABILITY__AUTH__RPI_API_URL
          value: {{ printf "http://rpi-interactionapi:%v" $iaCfg.service.port | quote }}
        {{- end }}
        {{- include "rpi.customCACerts.envVar" . | nindent 8 }}
        {{- with $cfg.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        # Startup creates or verifies the Observability schema before the server listens.
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        {{- if $tel.enabled }}
        - name: telemetry
          mountPath: /run/telemetry
          readOnly: true
        {{- end }}
        {{- include "rpi.customCACerts.volumeMount" . | nindent 8 }}
        {{- include "rpi.cloudidentity.googleVolumeMounts" . | nindent 8 }}
      {{- if $tel.enabled }}
      # The collector sidecar: receives the services' spans on 4317 and 4318
      # and delivers them over the pod's loopback to the application with the
      # token the init step wrote. Its health endpoint is the collector's own
      # health_check extension.
      - name: collector
        image: {{ $tel.collector.image | quote }}
        imagePullPolicy: {{ .Values.global.deployment.images.imagePullPolicy | default "IfNotPresent" }}
        args: ["--config=/run/telemetry/collector.yaml"]
        securityContext:
          runAsUser: {{ $secCtx.runAsUser }}
          runAsGroup: {{ $secCtx.runAsGroup }}
          runAsNonRoot: true
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - name: otlp-grpc
          containerPort: 4317
          protocol: TCP
        - name: otlp-http
          containerPort: 4318
          protocol: TCP
        {{- with $tel.collector.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        startupProbe:
          httpGet:
            path: /
            port: 13133
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /
            port: 13133
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          periodSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: telemetry
          mountPath: /run/telemetry
          readOnly: true
      {{- end }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ printf "%s-data" $name }}
      - name: tmp
        emptyDir: {}
      {{- if $tel.enabled }}
      - name: telemetry
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: collector-template
        configMap:
          name: {{ printf "%s-collector" $name }}
      {{- end }}
      {{- include "rpi.customCACerts.volume" . | nindent 6 }}
      {{- include "rpi.cloudidentity.googleVolumes" . | nindent 6 }}
      {{- if .Values.nodeSelector.enabled }}
      nodeSelector:
        {{ .Values.nodeSelector.key }}: {{ .Values.nodeSelector.value }}
      {{- end }}
      {{- if .Values.tolerations.enabled }}
      tolerations:
        - effect: NoSchedule
          key: {{ .Values.nodeSelector.key }}
          operator: Equal
          value: {{ .Values.nodeSelector.value }}
      {{- end }}
{{- end }}
